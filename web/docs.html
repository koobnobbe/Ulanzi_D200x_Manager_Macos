<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
:root { color-scheme: dark; --bg: #111116; --panel: #1b1b24; --line: #2c2c3a; --text: #e8e8ef; --muted: #8a8aa0; --accent: #6c8cff; --err: #ff6b6b; --code: #0c0c12; }
body { margin: 0; font: 15px/1.6 system-ui, sans-serif; background: var(--bg); color: var(--text); }
header { display: flex; gap: 16px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0; margin-right: auto; }
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: calc(100vh - 50px); }
nav { border-right: 1px solid var(--line); padding: 16px 14px; font-size: 14px; }
nav ul { list-style: none; margin: 0; padding: 0; }
nav ul ul { padding-left: 12px; }
nav li { margin: 2px 0; }
nav a { display: block; padding: 4px 8px; border-radius: 6px; color: var(--muted); text-decoration: none; }
nav a:hover { color: var(--text); background: var(--panel); }
nav a.current { color: var(--text); background: var(--panel); font-weight: 600; }
nav p { margin: 14px 8px 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
nav h1, nav h2, nav h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 8px 4px; }
article { max-width: 820px; padding: 24px 32px 60px; }
article h1 { font-size: 28px; margin: 0 0 16px; }
article h2 { font-size: 21px; margin: 32px 0 10px; padding-top: 8px; border-top: 1px solid var(--line); }
article h3 { font-size: 17px; margin: 24px 0 8px; }
article h4 { font-size: 15px; margin: 18px 0 6px; }
article a { color: var(--accent); }
article code { background: var(--code); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font: 13px ui-monospace, Menlo, monospace; }
article pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow: auto; }
article pre code { border: 0; padding: 0; background: none; }
article table { border-collapse: collapse; margin: 12px 0; display: block; overflow-x: auto; }
article th, article td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
article th { background: var(--panel); }
article blockquote { margin: 14px 0; padding: 8px 14px; border-left: 3px solid var(--accent); background: var(--panel); border-radius: 0 6px 6px 0; }
article blockquote p { margin: 4px 0; }
article img { max-width: 100%; border-radius: 8px; }
article hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
.missing { color: var(--err); }
@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  nav { border-right: 0; border-bottom: 1px solid var(--line); }
  article { padding: 20px 16px 48px; }
}
</style>
</head>
<body>
<header>
  <h1 id="heading"></h1>
</header>
<div class="shell">
  <nav id="nav"></nav>
  <article id="page"></article>
</div>
<script>
// Wiki pages are Markdown files in docs/. The menu is docs/_sidebar.md; links to "page.md" open that page here.
const $ = (id) => document.getElementById(id);

// Texts of this viewer come from lang/<language>.yaml via /api/lang, like the manager itself.
let TEXTS = {};

function t(key, values = {}) {
  let text = TEXTS[key] ?? key;
  for (const [name, value] of Object.entries(values)) text = text.replaceAll('{' + name + '}', value);
  return text;
}

function escapeHtml(text) {
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function slug(text) {
  return text.toLowerCase().replace(/<[^>]+>/g, '').replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '');
}

function linkTarget(href) {
  // "page.md" or "page.md#part" -> "#/page" or "#/page/part"; other links stay as they are.
  const match = href.match(/^([\w-]+)\.md(?:#(.+))?$/);
  if (match) return '#/' + match[1] + (match[2] ? '/' + match[2] : '');
  if (href.startsWith('#')) return '#/' + currentPage + '/' + href.slice(1);
  return href;
}

function inline(text) {
  const codes = [];
  text = text.replace(/`([^`]+)`/g, (_, code) => { codes.push(code); return `\u0000${codes.length - 1}\u0000`; });
  text = escapeHtml(text);
  text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, alt, src) => `<img src="${/^(https?:|\/)/.test(src) ? src : '/docs/' + src}" alt="${alt}">`);
  text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, label, href) => {
    const target = linkTarget(href.replace(/&amp;/g, '&'));
    const external = /^https?:/.test(target);
    return `<a href="${target}"${external ? ' target="_blank" rel="noopener"' : ''}>${label}</a>`;
  });
  text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  return text.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${escapeHtml(codes[i])}</code>`);
}

function renderList(lines) {
  // Lines of one list; nesting follows the indentation (2+ spaces deeper = sublist).
  const items = [];
  const base = lines[0].match(/^\s*/)[0].length;
  for (const line of lines) {
    const indent = line.match(/^\s*/)[0].length;
    if (indent > base && items.length) items[items.length - 1].children.push(line);
    else if (/^\s*([-*]|\d+\.)\s+/.test(line)) items.push({ text: line.replace(/^\s*([-*]|\d+\.)\s+/, ''), children: [] });
    else if (items.length) items[items.length - 1].text += ' ' + line.trim();
  }
  const tag = /^\s*\d+\./.test(lines[0]) ? 'ol' : 'ul';
  return `<${tag}>` + items.map((item) => `<li>${inline(item.text)}${item.children.length ? renderList(item.children) : ''}</li>`).join('') + `</${tag}>`;
}

function renderTable(lines) {
  const cells = (line) => line.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
  const head = cells(lines[0]);
  const rows = lines.slice(2).map(cells);
  return '<table><thead><tr>' + head.map((c) => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>' +
    rows.map((r) => '<tr>' + r.map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>';
}

function markdown(source) {
  const lines = source.replace(/\r/g, '').split('\n');
  const out = [];
  let i = 0;
  const isList = (line) => /^\s*([-*]|\d+\.)\s+/.test(line);
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    if (line.startsWith('```')) {
      const code = [];
      for (i++; i < lines.length && !lines[i].startsWith('```'); i++) code.push(lines[i]);
      i++;
      out.push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`);
      continue;
    }
    const heading = line.match(/^(#{1,4})\s+(.*)$/);
    if (heading) {
      const level = heading[1].length;
      out.push(`<h${level} id="${slug(heading[2])}">${inline(heading[2])}</h${level}>`);
      i++;
      continue;
    }
    if (/^(-{3,}|\*{3,})\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
    if (line.startsWith('>')) {
      const quote = [];
      for (; i < lines.length && lines[i].startsWith('>'); i++) quote.push(lines[i].replace(/^>\s?/, ''));
      out.push(`<blockquote>${markdown(quote.join('\n'))}</blockquote>`);
      continue;
    }
    if (line.trim().startsWith('|') && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      const table = [];
      for (; i < lines.length && lines[i].trim().startsWith('|'); i++) table.push(lines[i]);
      out.push(renderTable(table));
      continue;
    }
    if (isList(line)) {
      const list = [];
      for (; i < lines.length && (isList(lines[i]) || (lines[i].trim() && /^\s+/.test(lines[i]))); i++) list.push(lines[i]);
      out.push(renderList(list));
      continue;
    }
    const para = [];
    for (; i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|>|\s*([-*]|\d+\.)\s+)/.test(lines[i]) && !lines[i].trim().startsWith('|'); i++) para.push(lines[i].trim());
    out.push(`<p>${inline(para.join(' '))}</p>`);
  }
  return out.join('\n');
}

let currentPage = 'README';

async function fetchPage(name) {
  const response = await fetch(`/docs/${encodeURIComponent(name)}.md`);
  if (!response.ok) throw new Error(t('docs_viewer.not_found', { name }));
  return response.text();
}

async function showPage() {
  const [, name = 'README', anchor] = location.hash.match(/^#\/([\w-]+)(?:\/(.+))?$/) || [];
  currentPage = name;
  try {
    const text = await fetchPage(name);
    $('page').innerHTML = markdown(text);
    const title = $('page').querySelector('h1');
    document.title = (title ? title.textContent + ' · ' : '') + t('app.title');
  } catch (e) {
    $('page').innerHTML = `<h1>${escapeHtml(t('docs_viewer.not_found_title'))}</h1><p class="missing">${escapeHtml(e.message)}</p>` +
      `<p><a href="#/README">${escapeHtml(t('docs_viewer.home_link'))}</a></p>`;
  }
  for (const a of $('nav').querySelectorAll('a')) a.classList.toggle('current', a.getAttribute('href') === '#/' + name);
  const target = anchor && document.getElementById(anchor);
  if (target) target.scrollIntoView();
  else window.scrollTo(0, 0);
}

async function start() {
  try {
    TEXTS = await (await fetch('/api/lang')).json();
  } catch (e) {
    // without texts the keys are shown
  }
  document.documentElement.lang = t('app.lang');
  document.title = t('docs_viewer.title');
  $('heading').textContent = t('docs_viewer.title');
  try {
    $('nav').innerHTML = markdown(await fetchPage('_sidebar'));
  } catch (e) {
    $('nav').innerHTML = `<p class="missing">${escapeHtml(t('docs_viewer.no_sidebar'))}</p>`;
  }
  await showPage();
}

window.addEventListener('hashchange', showPage);
start();
</script>
</body>
</html>
