<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t="app.title">D200X Manager</title>
<style>
:root { color-scheme: dark; --bg: #111116; --panel: #1b1b24; --line: #2c2c3a; --text: #e8e8ef; --muted: #8a8aa0; --accent: #6c8cff; --err: #ff6b6b; }
body { margin: 0; font: 14px system-ui, sans-serif; background: var(--bg); color: var(--text); }
header { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 16px; margin: 0; margin-right: auto; }
main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; padding: 20px; }
.main-tabs { padding: 14px 20px 0; margin-bottom: 0; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.tab { padding: 6px 14px; }
.tabs-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
.tabs-row .tabs { flex: 1; margin-bottom: 0; }
.bg-field { margin-top: 14px; }
.bg-field .pick { margin-top: 6px; }
.bg-field .swatch { flex: none; width: 34px; margin-top: 4px; padding: 0; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.bg-remove { margin-top: 8px; color: var(--muted); }
.plugins-box { width: min(640px, 90vw); }
.plugin-card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-top: 12px; }
.plugin-head { display: flex; align-items: center; gap: 10px; }
.plugin-head input { display: inline; width: auto; margin: 0; }
.plugin-head .name { font-weight: 600; }
.plugin-head .version { color: var(--muted); font-size: 12px; }
.plugin-status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.plugin-status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.plugin-status .dot.connected, .plugin-status .dot.running { background: #34c759; }
.plugin-status .dot.connecting, .plugin-status .dot.starting { background: #ffcc00; }
.plugin-status .dot.error { background: var(--err); }
.plugin-msg { font-size: 12px; color: var(--muted); margin-top: 6px; white-space: pre-wrap; }
.plugin-msg.bad { color: var(--err); }
.plugin-settings label { display: block; margin-top: 10px; font-size: 13px; color: var(--muted); }
.plugin-settings label.check { display: flex; align-items: center; gap: 8px; }
.plugin-settings label.check input { width: auto; margin: 0; }
.combo { position: relative; }
.combo-list { display: none; position: absolute; z-index: 10; left: 0; right: 0; top: 100%; margin-top: 2px; max-height: 240px; overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 20px rgba(0, 0, 0, .35); }
.combo-list.open { display: block; }
.combo-item { padding: 6px 10px; cursor: pointer; color: var(--text); }
.combo-item:hover, .combo-item.active { background: var(--accent); color: #fff; }
.page-cfg { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; }
.tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.tab.add { color: var(--muted); border-style: dashed; }
.keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.key { position: relative; aspect-ratio: 1; padding: 0; border: 2px solid transparent; border-radius: 8px; overflow: hidden; background: #000; cursor: pointer; }
.key img { width: 100%; height: 100%; display: block; }
.key.text { background: #1f2a44; color: var(--text); font-size: 20px; font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 4px; text-align: center; word-break: break-word; }
.key.sel { border-color: var(--accent); }.key .num { position: absolute; left: 4px; top: 2px; font-size: 11px; background: rgba(0, 0, 0, .6); padding: 0 4px; border-radius: 4px; }
.deck { position: relative; max-width: 900px; margin: 0 auto; aspect-ratio: 1024 / 824; }
.deck-img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
/* The picture is 1024x824; tiles are 126x127 px at x=138, y=116 with a pitch of 157x158. */
.deck .keys { position: absolute; left: 13.477%; top: 14.078%; width: 73.633%; height: 53.762%;
  grid-template-columns: repeat(5, 16.711%); grid-template-rows: repeat(3, 28.668%); gap: 0; column-gap: 4.111%; row-gap: 6.998%; }
.deck .key { aspect-ratio: auto; width: 100%; height: 100%; border-radius: 11%; background: transparent; }
.deck .key.text { background: transparent; font-size: clamp(11px, 2vw, 20px); }
.deck .knob-btn { position: absolute; top: 85.5%; width: 10.2%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: transparent; border: 2px solid transparent; padding: 0; }
.knob-btn:hover { border-color: var(--accent); background: rgba(255, 255, 255, .08); }
.key.clockkey { aspect-ratio: auto; background: #000; }
.deck .key.side { position: absolute; width: 6.4%; height: auto; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); top: 85.5%; background: transparent; }
.deck .key .num { display: none; }
.key.clockkey { grid-column: span 2; aspect-ratio: 2 / 1; display: flex; padding: 0; background: #000; }
.key.clockkey img { width: 50%; height: 100%; object-fit: cover; }
.key.clockkey .face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 600 clamp(22px, 4.2vw, 46px) ui-monospace, Menlo, monospace; color: #fff; text-shadow: 0 1px 4px rgba(0, 0, 0, .6); pointer-events: none; letter-spacing: .04em; }
.knobs { display: flex; flex-wrap: wrap; gap: 10px; }
.knob { flex: 1; min-width: 180px; border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.knob .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
.row { display: flex; gap: 6px; margin-top: 8px; }
.row button { flex: 1; }
button { background: #2a2a3a; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit; }
button:hover { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
textarea { width: 100%; min-height: 560px; box-sizing: border-box; background: #0c0c12; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 13px ui-monospace, Menlo, monospace; resize: vertical; }
.bar { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
#error { color: var(--err); white-space: pre-wrap; margin: 10px 0 0; font: 12px ui-monospace, Menlo, monospace; }
#log { margin: 0; height: 160px; overflow: auto; white-space: pre-wrap; background: #0c0c12; border-radius: 8px; padding: 10px; font: 12px ui-monospace, Menlo, monospace; }
.wide { margin: 0 20px 20px; }
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr) 240px; min-height: calc(100vh - 60px); }
.lib { border-left: 1px solid var(--line); padding: 14px; overflow: auto; }
.lib-section { margin-bottom: 14px; }
.lib-section summary { cursor: pointer; font-size: 12px; color: var(--muted); margin: 0 0 6px; padding: 4px 0; text-transform: uppercase; letter-spacing: .06em; }
.lib-section summary:hover { color: var(--text); }
.lib-section.over { outline: 2px dashed var(--accent); border-radius: 8px; }
.lib-item { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; margin-bottom: 4px; cursor: grab; }
.lib-icon { width: 32px; height: 32px; flex: none; object-fit: contain; }
.lib-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-type { flex: none; width: 14px; height: 14px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.key.drop { border-color: var(--accent); }
.bin { display: flex; align-items: center; justify-content: center; border: 2px dashed var(--line); border-radius: 8px; padding: 10px 8px; margin-bottom: 14px; color: var(--muted); transition: color .15s, border-color .15s, background .15s; }
.bin.over { border-color: var(--err); color: var(--err); background: color-mix(in srgb, var(--err) 12%, transparent); }
.bin.over svg { transform: scale(1.15); }
.bin svg { transition: transform .15s; }
button.danger { color: var(--err); border-color: var(--err); display: inline-flex; align-items: center; }
button.danger:hover { background: var(--err); color: #fff; }
.lib-new { width: 100%; margin-bottom: 14px; color: var(--muted); border-style: dashed; }
@media (max-width: 900px) { .shell { grid-template-columns: 1fr; } }
/* On a wide screen the page itself doesn't scroll: each column scrolls on its own, so the deck in the middle stays in
   view while a long list of profiles or library keys scrolls. */
@media (min-width: 901px) {
  body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { flex: none; }
  .shell { flex: 1; min-height: 0; grid-template-rows: minmax(0, 1fr); }
  .side, .content, .lib { min-height: 0; overflow: auto; }
}
.side { border-right: 1px solid var(--line); padding: 14px; overflow: auto; display: flex; flex-direction: column; }
.doc-link { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); text-decoration: none; position: sticky; bottom: 0; background: var(--bg); }
.doc-link:hover { color: var(--text); border-color: var(--accent); }
.content { min-width: 0; }
.tree { display: flex; flex-direction: column; gap: 6px; }
.plugin-list { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; }
.plugin-list label { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.plugin-list input { display: inline; width: auto; margin: 0; }
.plugin-list .count { margin-left: auto; color: var(--muted); font-size: 12px; }
.profile-row { display: flex; gap: 6px; align-items: stretch; }
.profile-row .profile-btn { flex: 1; min-width: 0; }
.profile-icon { flex: none; width: 38px; padding: 3px; display: flex; align-items: center; justify-content: center; }
.profile-icon img { width: 28px; height: 28px; }
.profile-icon.empty { border-style: dashed; color: var(--muted); }
.profile-icon.none { visibility: hidden; }
.profile-app-preview { width: 32px; height: 32px; align-self: center; margin-top: 4px; }
.profile-btn { display: block; width: 100%; text-align: left; padding: 8px 10px; }
.profile-btn.active { color: var(--accent); }
.profile-btn.error { color: var(--err); }
.profile-btn.viewing { font-weight: 800; border-color: var(--accent); text-decoration: underline; }
.profile-btn.add { color: var(--muted); border-style: dashed; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
dialog::backdrop { background: rgba(0, 0, 0, .5); }
dialog input, dialog select { display: block; box-sizing: border-box; width: 100%; background: #0c0c12; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; margin-top: 4px; }
dialog form { width: min(640px, 90vw); }
#keyForm .grid2 { row-gap: 18px; }
#keyForm .tpanel { margin-bottom: 14px; }
#keyForm .tabs { margin-bottom: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
 #deviceForm h3 { font-size: 13px; margin: 16px 0 8px; color: var(--text); }
.grid2 label { font-size: 13px; color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
dialog input.hidden-picker { position: absolute; opacity: 0; width: 1px; height: 1px; padding: 0; margin: 0; border: 0; pointer-events: none; }
.pick { display: flex; gap: 6px; }
.pick input { flex: 1; }
.pick button { margin-top: 4px; }
.applist { max-height: 360px; overflow: auto; display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.applist button { text-align: left; }
.err { color: var(--err); font-size: 13px; margin-top: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1><span data-t="app.heading"></span> <span id="profile" style="font-weight: normal; color: var(--muted)"></span></h1>
  <label><span data-t="header.brightness"></span> <input id="bright" type="range" min="0" max="100" style="width: 160px"> <span id="brightVal"></span></label>
  <button id="screenBtn" data-t="header.screen"></button>
  <button id="deviceBtn" data-t="header.device"></button>
  <button id="librariesBtn" data-t="header.libraries"></button>
  <button id="pluginsBtn" data-t="header.plugins"></button>
  <button id="reload" data-t="header.reload"></button>
</header>
<div class="shell">
<aside class="side">
  <h2 data-t="sidebar.profiles"></h2>
  <div id="tree" class="tree"></div>
  <a class="doc-link" href="/docs" target="_blank" rel="noopener">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
    <span data-t="sidebar.docs"></span>
  </a>
</aside>
<div class="content">
<main>
  <div class="view" data-view="grid">
    <section>
      <h2 data-t="grid.pages"></h2>
      <div class="tabs-row">
        <div class="tabs" id="tabs"></div>
        <button type="button" id="pageCfgBtn" class="page-cfg"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span data-t="grid.page_config"></span></button>
      </div>
      <h2 id="keysTitle" data-t="grid.keys"></h2>
      <div class="deck" id="deck">
        <img class="deck-img" src="/web/ulanzi_black_tiles_transparent.png" alt="">
        <div class="keys" id="keys"></div>
        <div id="sideKeys"></div>
        <div id="knobs"></div>
      </div>
      <div id="error"></div>
    </section>
  </div>
</main>
<section class="wide">
  <h2 data-t="grid.log"></h2>
  <pre id="log"></pre>
</section>
</div>
<aside class="lib">
  <div id="bin" class="bin" data-t-title="library.bin" role="img">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/><path d="M10 11v6M14 11v6"/></svg>
  </div>
  <button type="button" id="libNew" class="lib-new" data-t="library.new"></button>
  <h2 data-t="library.title"></h2>
  <div id="library"></div>
</aside>
</div>
<dialog id="knobDlg">
  <form id="knobForm">
    <h2 id="knobHeader"></h2>
    <label><span data-t="knob_dialog.type"></span>
      <select id="knobType">
        <option value="text" data-t="knob_dialog.type_text"></option>
        <option value="key" data-t="knob_dialog.type_key"></option>
        <option value="device_brightness" data-t="knob_dialog.type_brightness"></option>
      </select></label>
    <div id="knobBuiltin">
      <label><span data-t="knob_dialog.left"></span> <input id="knobLeft" type="text"></label>
      <label><span data-t="knob_dialog.right"></span> <input id="knobRight" type="text"></label>
      <label><span data-t="knob_dialog.press"></span> <input id="knobPress" type="text"></label>
      <label><span data-t="knob_dialog.step"></span> <input id="knobStep" type="number" min="1" max="100"></label>
      <div class="hint" data-t="knob_dialog.hint"></div>
    </div>
    <div id="knobPluginFields"></div>
    <div id="knobErr" class="err"></div>
    <div class="bar">
      <span style="flex: 1"></span>
      <button type="button" id="knobCancel" data-t="common.cancel"></button>
      <button type="submit" class="primary" data-t="common.save"></button>
    </div>
  </form>
</dialog>
<dialog id="imgDlg">
  <div style="min-width: 420px">
    <h2 data-t="image_dialog.title"></h2>
    <div class="bar"><button type="button" id="imgUp" data-t="image_dialog.up"></button><span id="imgDir" class="hint" style="margin: 0"></span></div>
    <div id="imgList" class="applist"></div>
    <div class="bar"><span style="flex: 1"></span><button type="button" id="imgCancel" data-t="common.close"></button></div>
  </div>
</dialog>
<dialog id="appDlg">
  <div style="min-width: 360px">
    <h2 data-t="app_dialog.title"></h2>
    <select id="appRoot">
      <option value="/Applications">/Applications</option>
      <option value="/System/Applications">/System/Applications</option>
      <option value="/System/Applications/Utilities">/System/Applications/Utilities</option>
      <option value="~/Applications">~/Applications</option>
      <option value="/System/Library/CoreServices" data-t="app_dialog.finder_folder"></option>
    </select>
    <input id="appFilter" type="text" data-t-placeholder="app_dialog.filter" style="margin-top: 8px">
    <div id="appList" class="applist"></div>
    <div class="bar"><span style="flex: 1"></span><button type="button" id="appCancel" data-t="common.close"></button></div>
  </div>
</dialog>
<dialog id="keyDlg">
  <form id="keyForm">
    <h2 id="kHeader" data-t="key_dialog.title"></h2>
    <input id="kType" type="hidden">
    <div id="kTabs" class="tabs">
      <button type="button" class="tab" data-type="text" data-t="key_dialog.tab_text"></button>
      <button type="button" class="tab" data-type="key" data-t="key_dialog.tab_key"></button>
      <button type="button" class="tab" data-type="app" data-t="key_dialog.tab_app"></button>
      <button type="button" class="tab" data-type="page" data-t="key_dialog.tab_page"></button>
      <button type="button" class="tab" data-type="profile" data-t="key_dialog.tab_profile"></button>
    </div>
    <div class="grid2 top">
      <label><span data-t="key_dialog.key_title"></span> <input id="kTitleText" type="text"></label>
      <label><span data-t="key_dialog.icon"></span>
        <div class="pick"><select id="kIcon"></select><button type="button" id="kIconPick" data-t="common.new"></button></div></label>
    </div>
    <div class="tpanel" data-type="text">
      <div class="hint" data-t="key_dialog.hint_text"></div>
    </div>
    <div class="tpanel" data-type="key">
      <label><span data-t="key_dialog.pick_key"></span>
        <select id="kKeyPick"></select></label>
      <label><span data-t="key_dialog.keys"></span>
        <input id="kKeys" type="text" data-t-placeholder="key_dialog.keys_placeholder"></label>
      <div class="hint" data-t="key_dialog.hint_key"></div>
    </div>
    <div class="tpanel" data-type="app">
      <label><span data-t="key_dialog.app"></span>
        <div class="pick"><input id="kApp" type="text" placeholder="/Applications/...  |  raycast://..."><button type="button" id="kAppPick" data-t="common.choose"></button></div></label>
      <label><span data-t="key_dialog.app_profile"></span>
        <select id="kAppProfile"></select></label>
      <div class="hint" data-t="key_dialog.hint_app"></div>
    </div>
    <div class="tpanel" data-type="page">
      <label><span data-t="key_dialog.page"></span>
        <select id="kTarget"></select></label>
      <div class="hint" data-t="key_dialog.hint_page"></div>
    </div>
    <div class="tpanel" data-type="profile">
      <label><span data-t="key_dialog.profile"></span>
        <select id="kProfile"></select></label>
      <div class="hint" data-t="key_dialog.hint_profile"></div>
    </div>
    <div id="kPluginPanels"></div>
    <div class="grid2 shared">
      <label style="position: relative"><span data-t="key_dialog.background"></span> <input id="kBg" type="text" placeholder="#1a1a2e"><input id="kBgPicker" type="color" class="hidden-picker"></label>
      <label style="position: relative"><span data-t="key_dialog.color"></span> <input id="kColor" type="text" placeholder="#ffffff"><input id="kColorPicker" type="color" class="hidden-picker"></label>
      <label id="kClockImgWrap" style="grid-column: 1 / -1"><span data-t="key_dialog.clock_image"></span>
        <div class="pick"><select id="kClockImg"></select><button type="button" data-pick="kClockImg" data-t="common.new"></button></div></label>
      <label><span data-t="key_dialog.transparency"></span> <input id="kTransp" type="number" min="0" max="100" placeholder="0"></label>
      <label><span data-t="key_dialog.font_size"></span> <input id="kFont" type="number" min="8" max="200"></label>
      <div><button type="button" id="kLpBtn" data-t="key_dialog.longpress_on"></button></div>
      <div id="holdFields" class="grid2" style="display: none; grid-column: 1 / -1">
      <label><span data-t="key_dialog.hold_type"></span>
        <select id="kHoldType">
          <option value="none" data-t="common.none"></option>
          <option value="page">page</option>
          <option value="profile">profile</option>
          <option value="key">key</option>
          <option value="app">app</option>

<script>
const $ = (id) => document.getElementById(id);
let state = null;
let viewName = null;
let lastActive = null;
let diagramPage = 1;

// All texts come from lang/<language>.yaml via /api/lang. t('key', {name: 'x'}) fills in {name}.
let TEXTS = {};

function t(key, values = {}) {
  let text = TEXTS[key] ?? key;
  for (const [name, value] of Object.entries(values)) text = text.replaceAll('{' + name + '}', value);
  return text;
}

function applyTexts() {
  document.documentElement.lang = t('app.lang');
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = t(el.dataset.t);
  for (const el of document.querySelectorAll('[data-t-placeholder]')) el.placeholder = t(el.dataset.tPlaceholder);
  for (const el of document.querySelectorAll('[data-t-title]')) el.title = t(el.dataset.tTitle);
}

function log(text) {
  const box = $('log');
  box.textContent += text + '\n';
  box.scrollTop = box.scrollHeight;
}

async function api(path, body) {
  const options = body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}

async function guarded(action) {
  try {
    await action();
  } catch (e) {
    log(t('log.error', { message: e.message }));
  }
}

function activeName() {
  return state.profile;
}

function isActiveView() {
  return viewName === activeName();
}

function viewedProfile() {
  return state.profiles.find((p) => p.name === viewName) || { buttons: [] };
}

function viewedPages() {
  if (isActiveView()) return state.pages;
  return viewedProfile().pages || [...new Set(viewedProfile().buttons.map((b) => b.page))].sort((a, b) => a - b);
}

function pageSettings(page) {
  return (viewedProfile().page_settings || {})[page] || {};
}

function pageLabel(page) {
  return pageSettings(page).name || t('grid.page_tab', { page });
}

function viewedPage() {
  return isActiveView() ? state.page : diagramPage;
}

// Rendered images for a profile that is not on the deck, fetched per page.
let preview = null;

function viewedPreview() {
  const key = `${viewName}|${viewedPage()}`;
  if (preview && preview.key === key) return preview;
  if (!preview || preview.pending !== key) {
    preview = { pending: key };
    api(`/api/preview?name=${encodeURIComponent(viewName)}&page=${viewedPage()}`)
      .then((data) => {
        if (!preview || preview.pending !== key) return;
        preview = { key, ...data };
        renderKeys();
      })
      .catch((e) => log(t('log.error', { message: e.message })));
  }
  return null;
}

function viewedKeys() {
  if (isActiveView()) return state.keys;
  const images = viewedPreview();
  const keys = {};
  for (const b of viewedProfile().buttons) {
    if (b.page === diagramPage) keys[b.number] = { ...b, icon: images ? images.keys[b.number] : null };
  }
  return keys;
}

function viewedClock() {
  if (isActiveView()) return state.clock || [];
  const images = viewedPreview();
  return images ? images.clock : [];
}

const HOLD_TYPES = ['none', 'page', 'profile', 'key', 'app'];
let keyTarget = null;

function asText(value) {
  return Array.isArray(value) ? value.join(', ') : (value ?? '').toString();
}

function attachColorPicker(textId, pickerId, fallback) {
  $(textId).onclick = () => {
    const picker = $(pickerId);
    picker.value = /^#[0-9a-f]{6}$/i.test($(textId).value) ? $(textId).value : fallback;
    if (picker.showPicker) picker.showPicker();
    else picker.click();
  };
  $(pickerId).oninput = () => { $(textId).value = $(pickerId).value; };
}

attachColorPicker('kColor', 'kColorPicker', '#ffffff');
attachColorPicker('kBg', 'kBgPicker', '#1a1a2e');

function longpressOn() {
  return $('holdFields').style.display !== 'none';
}

function setLongpress(on) {
  $('holdFields').style.display = on ? '' : 'none';
  $('kLpBtn').textContent = t(on ? 'key_dialog.longpress_off' : 'key_dialog.longpress_on');
  if (on && $('kHoldType').value === 'none') $('kHoldType').value = 'profile';
}

$('kLpBtn').onclick = () => setLongpress(!longpressOn());

function buildAppProfileOptions(current) {
  const select = $('kAppProfile');
  select.textContent = '';
  const options = [['', t('key_dialog.app_profile_auto')], ['none', t('key_dialog.app_profile_none')], ...state.profiles.map((p) => [p.name, p.name])];
  if (current && !options.some(([value]) => value === current)) options.push([current, current]);
  for (const [value, label] of options) {
    const option = document.createElement('option');
    option.value = value;
    option.textContent = label;
    select.append(option);
  }
  select.value = current;
}

function buildTargetOptions(current) {
  const select = $('kTarget');
  select.textContent = '';
  const options = [['home', t('key_dialog.page_home')], ['next', t('key_dialog.page_next')], ['previous', t('key_dialog.page_previous')],
    ...viewedPages().map((p) => [String(p), t('key_dialog.page_number', { page: p }) + (pageSettings(p).name ? ` · ${pageSettings(p).name}` : '')])];
  if (current && !options.some(([value]) => value === current)) options.push([current, t('key_dialog.page_number', { page: current })]);
  for (const [value, label] of options) {
    const option = document.createElement('option');
    option.value = value;
    option.textContent = label;
    select.append(option);
  }
  select.value = current || 'home';
}

function fillKeyForm(raw) {
  $('kType').value = raw.type || 'text';
  $('kTitleText').value = asText(raw.title);
  $('kKeys').value = asText(raw.keys);
  $('kApp').value = asText(raw.app);
  buildTargetOptions(asText(raw.page));
  $('kProfile').value = raw.profile || 'default';
  guarded(() => loadIcons(asText(raw.icon)));
  $('kBg').value = asText(raw.background);
  $('kColor').value = asText(raw.color);
  $('kFont').value = asText(raw.font_size);
  $('kTransp').value = asText(raw.transparency);
  $('kClockImgWrap').style.display = keyTarget.number === 14 ? '' : 'none';
  if (keyTarget.number === 14) guarded(() => loadBackgrounds('kClockImg', asText(raw.background_image)));
  const hold = raw.hold || {};
  $('kHoldType').value = hold.type || 'none';
  $('kHoldValue').value = asText(hold.page ?? hold.profile ?? hold.keys ?? hold.app);
  buildAppProfileOptions(raw.profile || '');
  setLongpress(Boolean(raw.hold));
  for (const tp of pluginTypes('key')) setPluginFields(tp, 'kp', raw.type === tp.type ? raw : {});
  // types of a plugin that is off are not offered, unless this key already has one
  for (const tab of document.querySelectorAll('#kTabs .plugin-tab')) {
    const tp = pluginType(tab.dataset.type);
    tab.style.display = tp && !tp.plugin.enabled && tab.dataset.type !== raw.type ? 'none' : '';
  }
  showKeyTab(raw.type || 'text');
}

function readKeyForm() {
  const v = (id) => $(id).value.trim();
  const type = $('kType').value;
  const data = {};
  if (type !== 'text') data.type = type;
  if (v('kTitleText')) data.title = v('kTitleText');
  if (type === 'key' && v('kKeys')) {
    const combos = v('kKeys').split(',').map((s) => s.trim()).filter(Boolean);
    data.keys = combos.length === 1 ? combos[0] : combos;
  }
  if (type === 'app' && v('kApp')) data.app = v('kApp');
  if (type === 'app' && $('kAppProfile').value) data.profile = $('kAppProfile').value;
  if (type === 'page' && v('kTarget')) data.page = /^\d+$/.test(v('kTarget')) ? Number(v('kTarget')) : v('kTarget');
  if (type === 'profile' && $('kProfile').value) data.profile = $('kProfile').value;
  const tp = pluginType(type);
  if (tp) readPluginFields(tp, 'kp', data);
  if (v('kIcon')) data.icon = v('kIcon');
  if (v('kBg')) data.background = v('kBg');
  if (v('kColor')) data.color = v('kColor');
  if (v('kFont')) data.font_size = Number(v('kFont'));
  if (v('kTransp')) data.transparency = Number(v('kTransp'));
  if (keyTarget.number === 14 && v('kClockImg')) data.background_image = v('kClockImg');
  const holdType = $('kHoldType').value;
  if (longpressOn() && holdType !== 'none' && v('kHoldValue')) {
    const value = v('kHoldValue');
    const hold = { type: holdType };
    if (holdType === 'page') hold.page = /^\d+$/.test(value) ? Number(value) : value;
    else if (holdType === 'profile') hold.profile = value;
    else if (holdType === 'key') hold.keys = value;
    else hold.app = value;
    data.hold = hold;
  }
  return data;
}

function showKeyTab(type) {
  $('kType').value = type;
  for (const tab of document.querySelectorAll('#kTabs .tab')) tab.classList.toggle('active', tab.dataset.type === type);
  for (const panel of document.querySelectorAll('.tpanel')) panel.style.display = panel.dataset.type === type ? '' : 'none';
}

async function openKeyDialog(number) {
  const page = viewedPage();
  const data = await api(`/api/key?name=${encodeURIComponent(viewName)}&page=${page}&number=${number}`);
  keyTarget = { name: viewName, page, number };
  $('kHeader').textContent = t('key_dialog.header', { profile: viewName, page, number });
  $('kProfile').textContent = '';
  for (const profile of state.profiles) {
    const option = document.createElement('option');
    option.value = profile.name;
    option.textContent = profile.name;
    $('kProfile').append(option);
  }
  fillKeyForm(data.key);
  $('kErr').textContent = '';
  markSelected(number);
  $('keyDlg').showModal();
}

for (const tab of document.querySelectorAll('#kTabs .tab')) tab.onclick = () => showKeyTab(tab.dataset.type);

let appsCache = [];
let appPickTarget = 'kApp';  // input that receives the chosen app path

async function loadApps() {
  const data = await api('/api/apps?dir=' + encodeURIComponent($('appRoot').value));
  appsCache = data.apps;
  renderApps();
}

function renderApps() {
  const box = $('appList');
  box.textContent = '';
  const filter = $('appFilter').value.trim().toLowerCase();
  for (const app of appsCache.filter((a) => a.name.toLowerCase().includes(filter))) {
    const button = document.createElement('button');
    button.textContent = app.name;
    button.title = app.path;
    button.onclick = () => {
      $(appPickTarget).value = app.path;
      $(appPickTarget).dispatchEvent(new Event('input'));
      $('appDlg').close();
    };
    box.append(button);
  }
}

$('kAppPick').onclick = () => {
  appPickTarget = 'kApp';
  $('appDlg').showModal();
  guarded(loadApps);
};
$('appRoot').onchange = () => guarded(loadApps);
$('appFilter').oninput = renderApps;
$('appCancel').onclick = () => $('appDlg').close();

let browsed = null;
let bgSelect = null;  // select id when the image picker is choosing a background, else null (icon)

async function loadIcons(current) {
  const data = await api('/api/icons');
  const select = $('kIcon');
  select.textContent = '';
  const options = [['', t('key_dialog.no_icon')], ...data.icons.map((i) => [i, i])];
  if (current && !options.some(([value]) => value === current)) options.push([current, current]);
  for (const [value, label] of options) {
    const option = document.createElement('option');
    option.value = value;
    option.textContent = label;
    select.append(option);
  }
  select.value = current || '';
}

async function browse(dir) {
  const data = await api('/api/browse?dir=' + encodeURIComponent(dir));
  browsed = data;
  $('imgDir').textContent = data.dir;
  const box = $('imgList');
  box.textContent = '';
  for (const folder of data.dirs) {
    const button = document.createElement('button');
    button.textContent = folder.name + '/';
    button.onclick = () => guarded(() => browse(folder.path));
    box.append(button);
  }
  for (const file of data.files) {
    const button = document.createElement('button');
    button.textContent = file.name;
    button.onclick = () => guarded(async () => {
      const name = prompt(t(bgSelect ? 'image_dialog.save_as_background' : 'image_dialog.save_as_icon'), file.name.replace(/\.[^.]+$/, ''));
      if (!name) return;
      const errBox = $({ kClockImg: 'kErr', pBgImg: 'pErr', pgBgImg: 'pgErr' }[bgSelect] || (bgSelect ? 'dErr' : 'kErr'));
      try {
        if (bgSelect) {
          const result = await api('/api/background', { source: file.path, name });
          $('imgDlg').close();
          await loadBackgrounds(bgSelect, result.background);
        } else {
          const result = await api('/api/icon', { source: file.path, name });
          $('imgDlg').close();
          await loadIcons(result.icon);
        }
      } catch (err) {
        errBox.textContent = err.message;
        $('imgDlg').close();
      }
    });
    box.append(button);
  }
}

$('kIconPick').onclick = () => {
  bgSelect = null;
  $('imgDlg').showModal();
  guarded(() => browse(browsed ? browsed.dir : '~'));
};
$('imgUp').onclick = () => guarded(() => browse(browsed.parent));
$('imgCancel').onclick = () => $('imgDlg').close();
$('keyForm').onsubmit = (e) => {
  e.preventDefault();
  guarded(async () => {
    try {
      const result = await api('/api/key', { name: keyTarget.name, page: keyTarget.page, number: keyTarget.number, data: readKeyForm() });
      if (result.error) {
        $('kErr').textContent = result.error;
        return;
      }
      $('keyDlg').close();
      await load(true);
    } catch (err) {
      $('kErr').textContent = err.message;
    }
  });
};
$('kCancel').onclick = () => $('keyDlg').close();
$('kRemove').onclick = () => {
  if (!confirm(t('key_dialog.remove_confirm'))) return;
  guarded(async () => {
    const result = await api('/api/key/clear', keyTarget);
    if (result.error) {
      $('kErr').textContent = result.error;
      return;
    }
    $('keyDlg').close();
    await load(true);
  });
};
const KEY_GROUPS = [
  ['key_dialog.key_groups.media', ['volumeup', 'volumedown', 'mute', 'brightnessup', 'brightnessdown', 'play', 'next', 'previous']],
  ['key_dialog.key_groups.special', ['enter', 'esc', 'tab', 'space', 'backspace', 'delete', 'forwarddelete', 'up', 'down', 'left', 'right',
    'home', 'end', 'pageup', 'pagedown', ...Array.from({ length: 12 }, (_, i) => `f${i + 1}`)]],
  ['key_dialog.key_groups.letters', 'abcdefghijklmnopqrstuvwxyz'.split('')],
  ['key_dialog.key_groups.digits', '0123456789'.split('')],
  ['Cmd', ['cmd+a', 'cmd+c', 'cmd+v', 'cmd+x', 'cmd+z', 'cmd+shift+z', 'cmd+s', 'cmd+n', 'cmd+shift+n', 'cmd+w', 'cmd+q',
    'cmd+t', 'cmd+f', 'cmd+p', 'cmd+i', 'cmd+space', 'cmd+tab', 'cmd+enter', 'cmd+delete', 'cmd+shift+g', 'cmd+shift+h',
    'cmd+1', 'cmd+2', 'cmd+3', 'cmd+4']],
  ['Ctrl', ['ctrl+tab', 'ctrl+shift+tab']],
  ['key_dialog.key_groups.other', ['shift+=', 'shift+8', 'cmd+=', 'cmd+-']],
];

function buildKeyPicker() {
  for (const [label, keys] of KEY_GROUPS) {
    const group = document.createElement('optgroup');
    group.label = t(label);
    for (const key of keys) {
      const option = document.createElement('option');
      option.value = key;
      option.textContent = key;
      group.append(option);
    }
    $('kKeyPick').append(group);
  }
}
$('kKeyPick').onchange = () => {
  if ($('kKeyPick').value) $('kKeys').value = $('kKeyPick').value;
  $('kKeyPick').value = '';
};

function knobLabel(knob) {
  const match = knob.name.match(/^K(\d+)$/i);
  return match ? t('grid.knob', { number: match[1] }) : knob.name;
}

let knobTarget = null;

async function openKnobDialog(knob) {
  const data = await api(`/api/knobdata?profile=${encodeURIComponent(viewName)}&name=${encodeURIComponent(knob.name)}`);
  const raw = data.knob;
  knobTarget = { profile: viewName, name: knob.name, index: raw.index ?? knob.index };
  $('knobHeader').textContent = t('knob_dialog.header', { knob: knobLabel(knob), profile: viewName });
  for (const option of document.querySelectorAll('#knobType .plugin-option')) {
    const tp = pluginType(option.value);
    option.hidden = option.disabled = Boolean(tp && !tp.plugin.enabled && option.value !== raw.type);
  }
  $('knobType').value = raw.type || 'text';
  $('knobLeft').value = asText(raw.left);
  $('knobRight').value = asText(raw.right);
  $('knobPress').value = asText(raw.press);
  $('knobStep').value = raw.step ?? 10;
  showKnobFields(raw);
  $('knobErr').textContent = '';
  $('knobDlg').showModal();
}

$('knobForm').onsubmit = (e) => {
  e.preventDefault();
  guarded(async () => {
    const type = $('knobType').value;
    const data = { index: knobTarget.index, type };
    const tp = pluginType(type);
    if (tp) {
      readPluginFields(tp, 'kn', data);
    } else if (type === 'device_brightness') {
      data.step = Number($('knobStep').value) || 10;
    } else {
      for (const [field, id] of [['left', 'knobLeft'], ['right', 'knobRight'], ['press', 'knobPress']]) {
        const value = $(id).value.trim();
        if (value) data[field] = value;
      }
    }
    const result = await api('/api/knobcfg', { profile: knobTarget.profile, name: knobTarget.name, data });
    if (result.error) {
      $('knobErr').textContent = result.error;
      return;
    }
    $('knobDlg').close();
    await load(true);
  });
};
$('knobCancel').onclick = () => $('knobDlg').close();

function markSelected(number) {
  document.querySelectorAll('.key').forEach((el) => el.classList.toggle('sel', Number(el.dataset.number) === number));
}

function keyButton(number, key) {
  const button = document.createElement('button');
  button.className = 'key' + (key.icon ? '' : ' text');
  button.dataset.number = number;
  button.title = key.title || key.type || '';
  if (key.icon) {
    const img = document.createElement('img');
    img.src = '/icon/' + encodeURIComponent(key.icon);
    img.alt = '';
    button.append(img);
  } else if (key.title) {
    button.append(document.createTextNode(key.title));
  }
  const num = document.createElement('span');
  num.className = 'num';
  num.textContent = number;
  button.append(num);
  button.draggable = Boolean(key.type || key.title);
  button.ondragstart = (e) => e.dataTransfer.setData(KEY_MIME, JSON.stringify({ name: viewName, page: viewedPage(), number }));
  button.ondragover = (e) => e.preventDefault();
  button.ondragenter = () => button.classList.add('drop');
  button.ondragleave = () => button.classList.remove('drop');
  button.ondrop = (e) => {
    e.preventDefault();
    button.classList.remove('drop');
    const raw = e.dataTransfer.getData('text/plain');
    const source = e.dataTransfer.getData(KEY_MIME);
    const libraryRef = e.dataTransfer.getData(LIB_MIME);
    if (!raw && !source) return;
    guarded(async () => {
      let data;
      if (raw) {
        data = JSON.parse(raw);
        // A library key's own icon comes out of the library's zip into icons/.
        if (libraryRef) await api('/api/library/extract', JSON.parse(libraryRef));
      } else {
        const ref = JSON.parse(source);
        data = (await api(`/api/key?name=${encodeURIComponent(ref.name)}&page=${ref.page}&number=${ref.number}`)).key;
      }
      const result = await api('/api/key', { name: viewName, page: viewedPage(), number, data });
      if (result.error) {
        $('error').textContent = result.error;
        return;
      }
      if (source) {
        const ref = JSON.parse(source);
        if (ref.name !== viewName || ref.page !== viewedPage() || ref.number !== number) {
          const cleared = await api('/api/key/clear', ref);
          if (cleared.error) {
            $('error').textContent = cleared.error;
            return;
          }
        }
      }
      await load(true);
    });
  };
  button.onclick = () => guarded(() => openKeyDialog(number));
  return button;
}

function renderKeys() {
  const box = $('keys');
  box.textContent = '';
  $('keysTitle').textContent = t('grid.keys_title', { profile: viewName, page: viewedPage() });
  const keys = viewedKeys();
  for (let n = 1; n <= 13; n++) box.append(keyButton(n, keys[n] || {}));
  const first = keys[14] || {};
  const tiles = viewedClock();
  const clockKey = keyButton(14, first);
  clockKey.classList.remove('text');
  clockKey.classList.add('clockkey');
  clockKey.title = first.icon || first.title ? first.title || t('grid.key_14') : t('grid.clock_window');
  [...clockKey.childNodes].filter((n) => !(n.classList && n.classList.contains('num'))).forEach((n) => n.remove());
  clockKey.prepend(...tiles.map((name) => {
    const img = document.createElement('img');
    img.src = '/icon/' + encodeURIComponent(name);
    img.alt = '';
    return img;
  }));
  if (!first.icon && !first.title) {
    const face = document.createElement('span');
    face.className = 'face';
    clockKey.append(face);
    tickClock();
  }
  box.append(clockKey);
  const side = $('sideKeys');
  side.textContent = '';
  for (const [n, left] of [[16, 19.3], [17, 34.9]]) {
    const button = keyButton(n, keys[n] || {});
    button.classList.add('side');
    button.style.left = left + '%';
    side.append(button);
  }
}

function tickClock() {
  const text = new Date().toLocaleTimeString(t('app.locale'), { hour12: false });
  document.querySelectorAll('.clockkey .face').forEach((el) => { el.textContent = text; });
}
setInterval(tickClock, 1000);

// Centers of the three knobs in the deck picture, as a percentage of its width.
const KNOB_X = [51, 67.6, 84.6];

function renderKnobs() {
  const box = $('knobs');
  box.textContent = '';
  const knobs = [...state.knobs].sort((a, b) => a.index - b.index);
  knobs.forEach((knob, i) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'knob-btn';
    button.style.left = KNOB_X[i] + '%';
    button.title = pluginType(knob.type) ? `${knobLabel(knob)}\n${pluginType(knob.type).label}: ${knob.entity || '-'}`
      : t('grid.knob_tooltip', { knob: knobLabel(knob), left: knob.left || '-', press: knob.press || '-', right: knob.right || '-' });
    button.onclick = () => guarded(() => openKnobDialog(knob));
    box.append(button);
  });
}

function renderTabs() {
  const box = $('tabs');
  box.textContent = '';
  const current = viewedPage();
  for (const page of viewedPages()) {
    const tab = document.createElement('button');
    tab.className = 'tab' + (page === current ? ' active' : '');
    tab.textContent = pageLabel(page);
    tab.onclick = () => guarded(async () => {
      if (isActiveView()) {
        await api('/api/page', { page });
        await load(true);
      } else {
        diagramPage = page;
        renderViewed();
      }
    });
    box.append(tab);
  }
  const add = document.createElement('button');
  add.className = 'tab add';
  add.textContent = t('grid.new_page');
  add.onclick = () => guarded(async () => {
    await api('/api/pages/add', { name: viewName });
    await load(true);
    await openInEditor(viewName);
  });
  box.append(add);
}

function rememberView() {
  const hash = '#' + encodeURIComponent(viewName) + '/' + viewedPage();
  if (location.hash !== hash) history.replaceState(null, '', hash);
}

function restoreView() {
  // "#Agenda/2" from the address: open that profile and page again after a page reload.
  const match = location.hash.match(/^#([^/]+)\/(\d+)$/);
  if (!match) return;
  const name = decodeURIComponent(match[1]);
  if (state.profiles.some((p) => p.name === name)) {
    viewName = name;
    diagramPage = Number(match[2]);
  }
}

function renderViewed() {
  const pages = viewedPages();
  if (!pages.includes(diagramPage)) diagramPage = pages[0] ?? 1;
  rememberView();
  renderTabs();
  renderKeys();
}

function renderTree() {
  const box = $('tree');
  box.textContent = '';
  for (const profile of state.profiles) {
    const button = document.createElement('button');
    button.className = 'profile-btn' + (profile.active ? ' active' : '') + (profile.error ? ' error' : '') + (profile.name === viewName ? ' viewing' : '');
    button.dataset.profile = profile.name;
    button.title = profile.error || '';
    button.textContent = profile.active ? t('sidebar.active', { name: profile.name }) : profile.name;
    button.onclick = () => guarded(() => openInEditor(profile.name));
    const icon = document.createElement('button');
    icon.type = 'button';
    icon.className = 'profile-icon' + (profile.app ? '' : ' empty');
    if (profile.name === 'default') {
      icon.title = t('sidebar.default_settings');
      icon.textContent = '…';
    } else if (profile.app) {
      icon.title = t('sidebar.linked_app', { app: profile.app });
      const img = document.createElement('img');
      img.src = '/appicon?path=' + encodeURIComponent(profile.app);
      img.alt = '';
      icon.append(img);
    } else {
      icon.title = t('sidebar.no_app');
      icon.textContent = '+';
    }
    icon.onclick = () => guarded(() => openProfileDialog(profile));
    const row = document.createElement('div');
    row.className = 'profile-row';
    row.append(button, icon);
    box.append(row);
  }
  const add = document.createElement('button');
  add.className = 'profile-btn add';
  add.textContent = t('sidebar.new_profile');
  add.onclick = () => openNewDialog();
  box.append(add);
}

function openNewDialog() {
  $('newName').value = '';
  $('newErr').textContent = '';
  $('newDlg').showModal();
  $('newName').focus();
}

$('newForm').onsubmit = (e) => {
  e.preventDefault();
  guarded(async () => {
    try {
      const result = await api('/api/profile/new', { name: $('newName').value.trim() });
      $('newDlg').close();
      await load(true);
      await openInEditor(result.name);
      log(t('log.profile_created', { name: result.name }));
    } catch (err) {
      $('newErr').textContent = err.message;
    }
  });
};
$('newCancel').onclick = () => $('newDlg').close();

function render(keepText) {
  $('profile').textContent = t('header.profile', { name: state.profile });
  renderKnobs();
  $('bright').value = state.brightness;
  $('brightVal').textContent = state.brightness;
  $('error').textContent = state.error ? t('grid.config_error', { error: state.error }) : '';
  renderTree();
  const now = activeName();
  const switched = lastActive !== null && lastActive !== now;
  // When the deck changes profile, follow it only if you were looking at the profile that was on the deck;
  // a profile you chose to view (and edit) stays in view.
  const following = viewName === null || viewName === lastActive;
  lastActive = now;
  if (switched && following) viewName = now;
  renderViewed();
  if ((switched && following) || !keepText) guarded(() => openInEditor(viewName || now));
}

async function openInEditor(name) {
  if (name !== viewName) diagramPage = 1;   // another profile starts on its first page
  viewName = name;
  $('error').textContent = '';
  renderTree();
  renderViewed();
}

async function load(keepText) {
  state = await api('/api/state');
  preview = null;
  render(keepText);
}

async function loadBackgrounds(id, current, emptyLabel = t('common.none')) {
  const data = await api('/api/backgrounds');
  const select = $(id);
  select.textContent = '';
  const options = [['', emptyLabel], ...data.backgrounds.map((i) => [i, i])];
  if (current && !options.some(([value]) => value === current)) options.push([current, current]);
  for (const [value, label] of options) {
    const option = document.createElement('option');
    option.value = value;
    option.textContent = label;
    select.append(option);
  }
  select.value = current || '';
}

// A background field: none / an image / a solid color (with a color picker), and a button that removes it.
function setupBackgroundField(prefix) {
  attachColorPicker(prefix + 'BgColor', prefix + 'BgColorPicker', '#000000');
  const sync = () => {
    const mode = $(prefix + 'BgMode').value;
    $(prefix + 'BgImageRow').style.display = mode === 'image' ? '' : 'none';
    $(prefix + 'BgColorRow').style.display = mode === 'color' ? '' : 'none';
    $(prefix + 'BgRemove').style.display = mode ? '' : 'none';
    const color = $(prefix + 'BgColor').value.trim();
    $(prefix + 'BgSwatch').style.background = /^#[0-9a-f]{6}$/i.test(color) ? color : 'transparent';
  };
  $(prefix + 'BgMode').onchange = sync;
  $(prefix + 'BgColor').addEventListener('input', sync);
  $(prefix + 'BgColorPicker').addEventListener('input', sync);
  $(prefix + 'BgSwatch').onclick = () => $(prefix + 'BgColor').click();
  $(prefix + 'BgRemove').onclick = () => {
    $(prefix + 'BgMode').value = '';
    sync();
  };
  return sync;
}

const syncBackground = { p: setupBackgroundField('p'), pg: setupBackgroundField('pg') };

async function fillBackgroundField(prefix, values, noneLabel) {
  $(prefix + 'BgMode').options[0].textContent = noneLabel;
  $(prefix + 'BgMode').value = values.background_image ? 'image' : values.background_color ? 'color' : '';
  $(prefix + 'BgColor').value = values.background_color || '';
  await loadBackgrounds(prefix + 'BgImg', values.background_image || '');
  syncBackground[prefix]();
}

function readBackgroundField(prefix) {
  const mode = $(prefix + 'BgMode').value;
  return {
    background_image: mode === 'image' ? $(prefix + 'BgImg').value : '',
    background_color: mode === 'color' ? $(prefix + 'BgColor').value.trim() : '',
  };
}

// --- plugins: their key and knob types in the dialogs, and the Plugins dialog
let pluginData = [];

async function loadPlugins() {
  pluginData = (await api('/api/plugins')).plugins;
}

function pluginTypes(kind) {
  return pluginData.flatMap((p) => p.key_types.filter((tp) => tp.kind === kind).map((tp) => ({ ...tp, plugin: p })));
}

function pluginType(type) {
  return [...pluginTypes('key'), ...pluginTypes('knob')].find((tp) => tp.type === type);
}

function fieldId(prefix, type, key) {
  return `${prefix}-${type}-${key}`.replace(/[^\w-]/g, '_');
}

function hint(text) {
  const el = document.createElement('div');
  el.className = 'hint';
  el.textContent = text;
  return el;
}

// Entities per plugin and domain filter, fetched once per page load (the picker searches in this list).
const entityCache = {};

async function entities(tp, field) {
  const key = tp.plugin.id + '|' + (field.domains || []).join(',');
  if (!entityCache[key]) {
    entityCache[key] = api('/api/plugins/call', { id: tp.plugin.id, action: 'entities', data: { domains: field.domains || [] } })
      .then((result) => result.result)
      .catch((err) => {
        delete entityCache[key];   // offline or off: try again next time
        throw err;
      });
  }
  return entityCache[key];
}

// A searchable picker that shows only the friendly name; the entity id is kept in input.dataset.value.
function entityPicker(tp, field, input) {
  const wrap = document.createElement('div');
  wrap.className = 'combo';
  const list = document.createElement('div');
  list.className = 'combo-list';
  wrap.append(input, list);
  let shown = [];
  let active = -1;

  const choose = (entity) => {
    input.dataset.value = entity.entity_id;
    input.value = entity.name;
    input.title = entity.entity_id;
    list.classList.remove('open');
  };
  const highlight = (index) => {
    active = index;
    [...list.children].forEach((el, i) => el.classList.toggle('active', i === index));
    if (list.children[index]) list.children[index].scrollIntoView({ block: 'nearest' });
  };
  const show = async () => {
    let all;
    try {
      all = await entities(tp, field);
    } catch (err) {
      list.classList.remove('open');
      return;
    }
    const query = input.value.trim().toLowerCase();
    // Search by name (and id, for those who know it); a selected name that is still in the box shows the whole list.
    const searching = query && input.value !== input.dataset.shown;
    shown = all.filter((e) => !searching || e.name.toLowerCase().includes(query) || e.entity_id.includes(query)).slice(0, 80);
    list.textContent = '';
    for (const entity of shown) {
      const item = document.createElement('div');
      item.className = 'combo-item';
      item.textContent = entity.name;
      item.title = entity.entity_id;
      item.addEventListener('mousedown', (e) => {
        e.preventDefault();   // keep the focus in the box until the choice is made
        choose(entity);
        input.dataset.shown = input.value;
      });
      list.append(item);
    }
    list.classList.toggle('open', shown.length > 0);
    highlight(shown.findIndex((e) => e.entity_id === input.dataset.value));
  };
  input.addEventListener('focus', () => {
    input.dataset.shown = input.value;
    show();
  });
  input.addEventListener('input', () => {
    delete input.dataset.value;   // typing starts a new search
    show();
  });
  input.addEventListener('blur', () => {
    list.classList.remove('open');
    // A typed entity id (or an exact name) still counts when nothing was picked from the list.
    if (!input.dataset.value) {
      const typed = input.value.trim();
      entities(tp, field).then((all) => {
        const match = all.find((e) => e.entity_id === typed || e.name.toLowerCase() === typed.toLowerCase());
        if (match) choose(match);
        else if (/^[a-z_]+\.[a-z0-9_]+$/.test(typed)) input.dataset.value = typed;
      }).catch(() => {
        if (/^[a-z_]+\.[a-z0-9_]+$/.test(typed)) input.dataset.value = typed;
      });
    }
  });
  input.addEventListener('keydown', (e) => {
    if (!list.classList.contains('open')) return;
    if (e.key === 'ArrowDown') highlight(Math.min(active + 1, shown.length - 1));
    else if (e.key === 'ArrowUp') highlight(Math.max(active - 1, 0));
    else if (e.key === 'Enter' && shown[active]) choose(shown[active]);
    else if (e.key === 'Escape') list.classList.remove('open');
    else return;
    e.preventDefault();
    e.stopPropagation();
  });
  return wrap;
}

function pluginFields(tp, prefix) {
  const nodes = [];
  for (const field of tp.fields) {
    const label = document.createElement('label');
    const span = document.createElement('span');
    span.textContent = field.label;
    const input = document.createElement('input');
    input.id = fieldId(prefix, tp.type, field.key);
    input.autocomplete = 'off';
    if (field.type === 'choice') {
      const select = document.createElement('select');
      select.id = input.id;
      for (const option of field.options || []) {
        const el = document.createElement('option');
        el.value = option.value;
        el.textContent = option.label;
        select.append(el);
      }
      label.append(span, ' ', select);
      nodes.push(label);
      continue;
    }
    if (field.type === 'entity') {
      input.type = 'text';
      input.placeholder = t('key_dialog.entity_placeholder');
      label.append(span, ' ', entityPicker(tp, field, input));
      nodes.push(label);
      continue;
    }
    label.append(span, ' ', input);
    if (field.type === 'number') {
      input.type = 'number';
      if (field.min !== undefined) input.min = field.min;
      if (field.max !== undefined) input.max = field.max;
      if (field.default !== undefined) input.placeholder = field.default;
    } else {
      input.type = 'text';
      if (field.placeholder) input.placeholder = field.placeholder;
    }
    nodes.push(label);
  }
  if (tp.fields.some((f) => f.type === 'entity')) nodes.push(hint(t('key_dialog.entity_hint')));
  if (!tp.plugin.enabled) nodes.push(hint(t('key_dialog.plugin_off')));
  return nodes;
}

function setPluginFields(tp, prefix, raw) {
  for (const field of tp.fields) {
    const input = $(fieldId(prefix, tp.type, field.key));
    const value = asText(raw[field.key]);
    input.value = field.type === 'choice' ? (value || field.default || (field.options[0] || {}).value || '') : value;
    if (field.type !== 'entity') continue;
    input.title = value;
    if (value) input.dataset.value = value;
    else delete input.dataset.value;
    // show the friendly name instead of the id once the list is there
    if (value) entities(tp, field).then((all) => {
      const match = all.find((e) => e.entity_id === value);
      if (match && input.dataset.value === value) input.value = match.name;
    }).catch(() => {});
  }
}

function readPluginFields(tp, prefix, data) {
  for (const field of tp.fields) {
    const input = $(fieldId(prefix, tp.type, field.key));
    const value = field.type === 'entity' ? (input.dataset.value || '') : input.value.trim();
    if (value) data[field.key] = field.type === 'number' ? Number(value) : value;
  }
}

function buildPluginKeyTabs() {
  document.querySelectorAll('#kTabs .plugin-tab').forEach((el) => el.remove());
  $('kPluginPanels').textContent = '';
  for (const tp of pluginTypes('key')) {
    const tab = document.createElement('button');
    tab.type = 'button';
    tab.className = 'tab plugin-tab';
    tab.dataset.type = tp.type;
    tab.textContent = tp.label;
    tab.onclick = () => showKeyTab(tp.type);
    $('kTabs').append(tab);
    const panel = document.createElement('div');
    panel.className = 'tpanel';
    panel.dataset.type = tp.type;
    panel.append(...pluginFields(tp, 'kp'));
    $('kPluginPanels').append(panel);
  }
}

function buildKnobTypes() {
  document.querySelectorAll('#knobType .plugin-option').forEach((el) => el.remove());
  for (const tp of pluginTypes('knob')) {
    const option = document.createElement('option');
    option.className = 'plugin-option';
    option.value = tp.type;
    option.textContent = tp.label;
    $('knobType').append(option);
  }
}

function showKnobFields(raw = {}) {
  const tp = pluginType($('knobType').value);
  $('knobBuiltin').style.display = tp ? 'none' : '';
  $('knobPluginFields').textContent = '';
  if (tp) {
    $('knobPluginFields').append(...pluginFields(tp, 'kn'));
    setPluginFields(tp, 'kn', raw);
  }
}
$('knobType').addEventListener('change', () => showKnobFields());

function renderPluginCards() {
  const box = $('pluginCards');
  box.textContent = '';
  if (!pluginData.length) {
    box.append(hint(t('plugins_dialog.none')));
    return;
  }
  for (const plugin of pluginData) {
    const card = document.createElement('div');
    card.className = 'plugin-card';
    card.dataset.id = plugin.id;
    const head = document.createElement('div');
    head.className = 'plugin-head';
    const enabled = document.createElement('input');
    enabled.type = 'checkbox';
    enabled.checked = plugin.enabled;
    enabled.title = t('plugins_dialog.on');
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = plugin.name;
    const version = document.createElement('span');
    version.className = 'version';
    version.textContent = plugin.version;
    const status = document.createElement('span');
    status.className = 'plugin-status';
    head.append(enabled, name, version, status);
    const message = document.createElement('div');
    message.className = 'plugin-msg';
    const form = document.createElement('div');
    form.className = 'plugin-settings';
    const inputs = {};
    for (const field of plugin.settings) {
      const label = document.createElement('label');
      const input = document.createElement('input');
      input.autocomplete = 'off';
      if (field.type === 'bool') {
        label.className = 'check';
        input.type = 'checkbox';
        input.checked = Boolean(field.value);
        label.append(input, field.label);
      } else {
        input.type = field.type === 'secret' ? 'password' : field.type === 'number' ? 'number' : 'text';
        if (field.type === 'number') {
          if (field.min !== undefined) input.min = field.min;
          if (field.max !== undefined) input.max = field.max;
        }
        if (field.type === 'secret') input.placeholder = field.is_set ? t('plugins_dialog.secret_set') : '';
        else {
          input.value = field.value ?? '';
          input.placeholder = field.placeholder || '';
        }
        label.append(field.label, input);
      }
      inputs[field.key] = { field, input };
      form.append(label);
    }
    const values = () => Object.fromEntries(Object.entries(inputs).map(([key, { field, input }]) =>
      [key, field.type === 'bool' ? input.checked : input.value.trim()]));
    const bar = document.createElement('div');
    bar.className = 'bar';
    const test = document.createElement('button');
    test.type = 'button';
    test.textContent = t('plugins_dialog.test');
    const save = document.createElement('button');
    save.type = 'button';
    save.className = 'primary';
    save.textContent = t('plugins_dialog.save');
    const spacer = document.createElement('span');
    spacer.style.flex = '1';
    bar.append(spacer, test, save);
    const say = (text, bad = false) => {
      message.textContent = text;
      message.classList.toggle('bad', bad);
    };
    enabled.onchange = () => guarded(async () => {
      try {
        await api('/api/plugins/enabled', { id: plugin.id, enabled: enabled.checked });
      } catch (err) {
        say(err.message, true);
      }
      await afterPluginChange();
    });
    test.onclick = () => guarded(async () => {
      say(t('plugins_dialog.testing'));
      try {
        const result = await api('/api/plugins/call', { id: plugin.id, action: 'test', data: values() });
        say(result.result.message);
      } catch (err) {
        say(err.message, true);
      }
    });
    save.onclick = () => guarded(async () => {
      try {
        await api('/api/plugins/settings', { id: plugin.id, settings: values() });
        say(t('plugins_dialog.saved'));
      } catch (err) {
        say(err.message, true);
        return;
      }
      await afterPluginChange();
    });
    card.append(head, hint(plugin.description), form, message, bar);
    box.append(card);
  }
  showPluginStatus();
}

function showPluginStatus() {
  for (const plugin of pluginData) {
    const card = document.querySelector(`.plugin-card[data-id="${plugin.id}"]`);
    if (!card) continue;
    const status = card.querySelector('.plugin-status');
    status.textContent = '';
    const dot = document.createElement('span');
    dot.className = 'dot ' + plugin.status.state;
    status.append(dot, t('plugins_dialog.status.' + plugin.status.state));
    status.title = plugin.status.message || '';
    const message = card.querySelector('.plugin-msg');
    if (!message.dataset.own) {
      message.textContent = plugin.status.message || '';
      message.classList.toggle('bad', plugin.status.state === 'error');
    }
  }
}

async function afterPluginChange() {
  await loadPlugins();
  showPluginStatus();
  buildPluginKeyTabs();
  buildKnobTypes();
  await load(true);
}

$('libraryImport').onclick = () => $('libraryFile').click();
async function base64(file) {
  const bytes = new Uint8Array(await file.arrayBuffer());
  let binary = '';
  for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(binary);
}

$('libraryFile').onchange = () => guarded(async () => {
  const files = [...$('libraryFile').files];
  $('libraryFile').value = '';
  if (!files.length) return;
  $('libraryErr').textContent = '';
  // Each .yaml is imported together with the .zip of the same name, if one was chosen.
  const stem = (file) => file.name.replace(/\.[^.]+$/, '');
  const yamls = files.filter((f) => /\.ya?ml$/i.test(f.name));
  const zips = files.filter((f) => /\.zip$/i.test(f.name));
  const errors = zips.filter((z) => !yamls.some((y) => stem(y) === stem(z)))
    .map((z) => t('libraries_dialog.zip_without_yaml', { file: z.name }));
  for (const file of yamls) {
    const zip = zips.find((z) => stem(z) === stem(file));
    try {
      const result = await api('/api/library/import', { filename: file.name, text: await file.text(), zip: zip ? await base64(zip) : null });
      log(t('log.library_imported', { name: result.section }));
    } catch (err) {
      errors.push(t('libraries_dialog.import_failed', { file: file.name, error: err.message }));
    }
  }
  $('libraryErr').textContent = errors.join('\n');
  libraryData = await api('/api/library');
  renderLibraries();
  renderLibrary();
});

let libraryData = { sections: [] };
const KEY_MIME = 'application/x-d200-key';
const LIB_MIME = 'application/x-d200-lib';

const bin = $('bin');
bin.ondragover = (e) => {
  if (!e.dataTransfer.types.includes(LIB_MIME)) return;

  bin.classList.add('over');
};
bin.ondragleave = () => bin.classList.remove('over');

bin.ondrop = (e) => {

libraryPanel.ondragover = (e) => {

libraryPanel.ondrop = (e) => {

function libOpen(name) {
  try {
    return localStorage.getItem('lib-closed:' + name) !== '1';
  } catch (e) {
    return true;
  }
}

function libSetOpen(name, open) {
  try {
    if (open) localStorage.removeItem('lib-closed:' + name);
    else localStorage.setItem('lib-closed:' + name, '1');
  } catch (e) {
    // storage unavailable: the state just won't persist
  }
}

// Small symbols for the kind of key in the library panel, instead of "(type)" text.
const TYPE_ICONS = {
  text: '<path d="M4 7V4h16v3"/><path d="M12 4v16"/><path d="M9 20h6"/>',
  key: '<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>',
  app: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  page: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M9 15h6"/>',
  profile: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  homeassistant: '<path d="M3 11 12 3l9 8"/><path d="M5 9.5V21h14V9.5"/><circle cx="12" cy="14" r="2.5"/>',
  plugin: '<path d="M9 2v6M15 2v6"/><path d="M6 8h12v4a6 6 0 0 1-12 0z"/><path d="M12 18v4"/>',
};
const BUILTIN_TYPES = { text: 'tab_text', key: 'tab_key', app: 'tab_app', page: 'tab_page', profile: 'tab_profile' };

function typeIcon(type) {
  const tp = pluginType(type);
  const shape = BUILTIN_TYPES[type] ? TYPE_ICONS[type] : (tp && TYPE_ICONS[tp.plugin.id]) || TYPE_ICONS.plugin;
  const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  icon.setAttribute('viewBox', '0 0 24 24');
  icon.setAttribute('class', 'lib-type');
  icon.innerHTML = shape;
  const label = document.createElementNS('http://www.w3.org/2000/svg', 'title');
  label.textContent = BUILTIN_TYPES[type] ? t('key_dialog.' + BUILTIN_TYPES[type]) : tp ? tp.label : type;
  icon.prepend(label);
  return icon;
}

function renderLibrary() {
  const box = $('library');
  box.textContent = '';
  for (const section of libraryData.sections.filter((s) => s.enabled)) {
    const wrap = document.createElement('details');
    wrap.className = 'lib-section';
    wrap.open = libOpen(section.section);
    wrap.addEventListener('toggle', () => libSetOpen(section.section, wrap.open));
    wrap.ondragover = (e) => {
      if (!e.dataTransfer.types.includes(LIB_MIME)) return;
      e.preventDefault();
      wrap.classList.add('over');
    };
    wrap.ondragleave = () => wrap.classList.remove('over');
    wrap.ondrop = (e) => {
      if (!e.dataTransfer.types.includes(LIB_MIME)) return;
      e.preventDefault();
      e.stopPropagation();
      wrap.classList.remove('over');
      const ref = JSON.parse(e.dataTransfer.getData(LIB_MIME));
      guarded(async () => {
        await api('/api/library/move', { section: ref.section, index: ref.index, target: section.section });
        libraryData = await api('/api/library');
        renderLibrary();
        log(t('log.library_moved', { section: section.section }));
      });
    };
    const heading = document.createElement('summary');
    heading.textContent = section.section;
    wrap.append(heading);
    for (const [index, item] of section.items.entries()) {
      const button = document.createElement('button');
      button.className = 'lib-item';
      let iconSrc = null;
      if (item.data.icon && item.data.icon.startsWith('icons/')) {
        // From icons/ or, until it is used on a key, from the library's zip.
        iconSrc = `/library/icon?section=${encodeURIComponent(section.section)}&name=${encodeURIComponent(item.data.icon.slice('icons/'.length))}`;
      } else if (item.data.type === 'app' && item.data.app) {
        iconSrc = '/appicon?path=' + encodeURIComponent(item.data.app);
      }
      if (iconSrc) {
        const img = document.createElement('img');
        img.className = 'lib-icon';
        img.width = 32;
        img.height = 32;
        img.alt = '';
        img.src = iconSrc;
        button.append(img);
      }
      const name = document.createElement('span');
      name.className = 'lib-name';
      name.textContent = item.title;
      button.append(name, typeIcon(item.data.type || 'text'));
      button.title = t('library.item_tooltip');
      button.draggable = true;
      button.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', JSON.stringify(item.data));
        e.dataTransfer.setData(LIB_MIME, JSON.stringify({ section: section.section, index }));
      });
      wrap.append(button);
    }
    box.append(wrap);
  }
}
