# Claude usage on the deck: the session (5 hour) and weekly limits of your Claude plan, as in Claude Code's
# "Account & usage" panel. Texts are in lang/<language>.yaml.
name: Claude usage
version: 0.2.0
module: plugin.py
class: ClaudeUsage

# No settings: the numbers come from Claude Code's status line (statusline.py), see docs/claude-usage.md.
settings: []

key_types:
  claude.usage:
    kind: key
    fields:
      - {key: window, type: choice, options: [five_hour, seven_day], default: five_hour, required: true}
