# Texts of the Claude usage plugin (es). Keys as in plugin.yaml; keep the {names}.
description: Muestra cuánto has usado de los límites de sesión (5 horas) y semanal de tu plan de Claude, como en el panel de uso de Claude Code. Los números vienen de la línea de estado de Claude Code; «Probar la conexión» la configura.
types:
  claude.usage: Uso de Claude
fields:
  window: Límite
options:
  window:
    five_hour: Sesión (5 h)
    seven_day: Semana (7 d)
status:
  updated: Últimos números de Claude Code a las {time}.
  installed: Línea de estado configurada en Claude Code. Envía un mensaje a Claude Code; entonces aparecen los números.
  test_ok: 'Funciona: sesión {session} %, semana {week} % (de Claude Code a las {time}).'
render:
  resets_in: Se reinicia en {time}
errors:
  no_data: 'Aún no hay números de Claude Code. Vienen de Claude Code en el terminal (no de la extensión de VS Code): ejecuta claude en un terminal y envía un mensaje.'
  other_statusline: 'Claude Code ya tiene otra línea de estado. Pon statusLine en ~/.claude/settings.json a: {command}'
