# Texts of the Claude usage plugin (nl). Keys as in plugin.yaml; keep the {names}.
description: Toont hoeveel je van de sessie- (5 uur) en weeklimiet van je Claude-abonnement gebruikt hebt, zoals in het gebruikspaneel van Claude Code. De cijfers komen uit de statusregel van Claude Code; "Verbinding testen" stelt die in.
types:
  claude.usage: Claude-gebruik
fields:
  window: Limiet
options:
  window:
    five_hour: Sessie (5u)
    seven_day: Week (7d)
status:
  updated: Laatste cijfers van Claude Code om {time}.
  installed: Statusregel ingesteld in Claude Code. Stuur Claude Code een bericht; dan verschijnen de cijfers.
  test_ok: 'Werkt: sessie {session}%, week {week}% (van Claude Code om {time}).'
render:
  resets_in: Reset over {time}
errors:
  no_data: 'Nog geen cijfers van Claude Code. Die komen van Claude Code in de terminal (niet de VS Code-extensie): start claude in een terminal en stuur een bericht.'
  other_statusline: 'Claude Code heeft al een andere statusregel. Zet statusLine in ~/.claude/settings.json op: {command}'
