# Texts of the Claude usage plugin (fr). Keys as in plugin.yaml; keep the {names}.
description: Affiche la part utilisée des limites de session (5 heures) et hebdomadaire de ton abonnement Claude, comme dans le panneau d'utilisation de Claude Code. Les chiffres viennent de la ligne d'état de Claude Code ; « Tester la connexion » la configure.
types:
  claude.usage: Utilisation de Claude
fields:
  window: Limite
options:
  window:
    five_hour: Session (5 h)
    seven_day: Semaine (7 j)
status:
  updated: Derniers chiffres de Claude Code à {time}.
  installed: Ligne d'état configurée dans Claude Code. Envoie un message à Claude Code ; les chiffres apparaissent ensuite.
  test_ok: 'Ça marche : session {session} %, semaine {week} % (de Claude Code à {time}).'
render:
  resets_in: Réinitialisation dans {time}
errors:
  no_data: 'Pas encore de chiffres de Claude Code. Ils viennent de Claude Code dans le terminal (pas de l''extension VS Code) : lance claude dans un terminal et envoie un message.'
  other_statusline: 'Claude Code a déjà une autre ligne d''état. Mets statusLine dans ~/.claude/settings.json sur : {command}'
