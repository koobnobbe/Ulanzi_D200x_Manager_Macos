# Texts of the Claude usage plugin (de). Keys as in plugin.yaml; keep the {names}.
description: Zeigt, wie viel vom Sitzungs- (5 Stunden) und Wochenlimit deines Claude-Abos verbraucht ist, wie im Nutzungsbereich von Claude Code. Die Zahlen kommen aus der Statuszeile von Claude Code; „Verbindung testen“ richtet sie ein.
types:
  claude.usage: Claude-Nutzung
fields:
  window: Limit
options:
  window:
    five_hour: Sitzung (5 Std.)
    seven_day: Woche (7 T.)
status:
  updated: Letzte Zahlen von Claude Code um {time}.
  installed: Statuszeile in Claude Code eingerichtet. Schick Claude Code eine Nachricht; dann erscheinen die Zahlen.
  test_ok: 'Funktioniert: Sitzung {session} %, Woche {week} % (von Claude Code um {time}).'
render:
  resets_in: Zurückgesetzt in {time}
errors:
  no_data: 'Noch keine Zahlen von Claude Code. Sie kommen von Claude Code im Terminal (nicht von der VS-Code-Erweiterung): starte claude in einem Terminal und schick eine Nachricht.'
  other_statusline: 'Claude Code hat schon eine andere Statuszeile. Setze statusLine in ~/.claude/settings.json auf: {command}'
