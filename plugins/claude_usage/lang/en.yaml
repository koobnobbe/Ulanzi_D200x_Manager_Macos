# Texts of the Claude usage plugin (en). Keys as in plugin.yaml; keep the {names}.
description: Shows how much of your Claude plan's session (5 hour) and weekly limits you have used, as in Claude Code's usage panel. The numbers come from Claude Code's status line; "Test connection" sets it up.
types:
  claude.usage: Claude usage
fields:
  window: Limit
options:
  window:
    five_hour: Session (5h)
    seven_day: Weekly (7d)
status:
  updated: Last numbers from Claude Code at {time}.
  installed: Status line set up in Claude Code. Send Claude Code a message; then the numbers appear.
  test_ok: 'Works: session {session}%, week {week}% (from Claude Code at {time}).'
render:
  resets_in: Resets in {time}
errors:
  no_data: 'No numbers from Claude Code yet. They come from Claude Code in the terminal (not the VS Code extension): run claude in a terminal and send a message.'
  other_statusline: 'Claude Code already has another status line. Set statusLine in ~/.claude/settings.json to: {command}'
