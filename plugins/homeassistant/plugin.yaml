# Home Assistant for the D200X. Texts are in lang/<language>.yaml under the keys named here.
name: Home Assistant
version: 0.1.0
module: plugin.py
class: HomeAssistant

# Per machine, in plugins.local.yaml (not in git).
settings:
  - {key: url, type: url, required: true, placeholder: "http://homeassistant.local:8123"}
  - {key: token, type: secret, required: true}
  - {key: verify_ssl, type: bool, default: true}

key_types:
  ha.toggle:
    kind: key
    fields:
      - {key: entity, type: entity, domains: [light, switch], required: true}
  ha.state:
    kind: key
    fields:
      - {key: entity, type: entity, required: true}
  ha.dimmer:
    kind: knob
    fields:
      - {key: entity, type: entity, domains: [light], required: true}
      - {key: step, type: number, min: 1, max: 50, default: 10}
