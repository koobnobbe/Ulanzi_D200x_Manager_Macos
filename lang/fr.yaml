  unlink: Dissocier l'app
  unlink_confirm: Dissocier l'app du profil {name} ? Le profil lui-même est conservé.

libraries_dialog:
  title: Bibliothèques
  hint: Seules les bibliothèques cochées apparaissent dans le panneau de bibliothèque.
