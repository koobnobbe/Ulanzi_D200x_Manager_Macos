  invalid_filename: "nom de fichier invalide : utilisez des lettres, des chiffres, un espace, - ou _"
  library_exists: la bibliothèque {name} existe déjà
  profile_exists: le profil {name} existe déjà
  choose_yaml: choisissez un fichier .yaml
  not_an_image: "pas une image : choisissez un png, jpg, ico ou icns"
  icon_name_needed: donnez un nom à l'icône
  image_name_needed: donnez un nom à l'image
  key_empty: cette touche est vide
  default_no_app: le profil default ne peut pas être lié à une app
  not_an_app: "pas une app : {app}"
  app_taken: "{app} active déjà le profil {profile}"
  background_missing: "arrière-plan introuvable : {path}"
  hex_color: "{field} doit être une couleur hexadécimale, par ex. #1a1a2e"
  saver_mode: mode d'économiseur inconnu
  keep_alive_range: l'intervalle keep-alive doit être entre 0,2 et 10 secondes
  saver_timeout_range: le délai de l'économiseur doit être entre 5 et 3600 secondes
  saver_brightness_range: la luminosité de l'économiseur doit être entre 0 et 100
  saver_image_needed: choisissez une image pour l'économiseur
  unknown_language: "langue inconnue : {language}"
  file_missing: "{field} : fichier introuvable"
  first_page: la page 1 ne peut pas être supprimée
  page_edge: cette page est déjà au bord
  page_name_long: le nom peut comporter au maximum {max} caractères
  unknown_page_number: la page {page} n'existe pas
  bad_zip: pas un zip valide d'icônes png

# Erreurs dans config.yaml ou un profil. La config précédente reste alors active.
config:
  key: "touche {number} : {error}"
  knob: "molette {name} : {error}"
  unknown_combo: "combinaison de touches inconnue : {combo}"
  unknown_type: "type inconnu : {type}"
  app_not_found: "app introuvable : {app}"
  keys_needed: le type key nécessite "keys"
  background_image_missing: "background_image introuvable : {path}"
  transparency_range: transparency doit être entre 0 et 100
  key_out_of_range: "page {page} : la touche {number} n'existe pas"
  unknown_page: "page {page} touche {number} : page inconnue : {target}"
  no_pages: ce fichier n'a pas de section pages
  page_missing: la page {page} n'est pas dans ce fichier
  buttons_moved: '"buttons" a été déplacé : placez les touches sous "pages: 1:"'

# Vérification d'un fichier de bibliothèque à l'import.
library_check:
  entry: touche {number}
  entry_titled: touche {number} ({title})
  hold: "{where} (hold)"
  not_a_key: "doit être une touche, par ex. {type: key, title: Copy, keys: cmd+c}"
  unknown_field: champ inconnu {fields}
  page_needed: le type page nécessite "page" (home, next, previous ou un numéro)
  profile_needed: le type profile nécessite "profile"
  not_a_color: "{field} n'est pas une couleur : {value}"
  font_size_range: font_size doit être un nombre de 8 à 200
  transparency_number: transparency doit être un nombre de 0 à 100
  icon_missing: "icône introuvable : {path}"
  hold_in_hold: un hold ne peut pas avoir son propre hold
  invalid_yaml: "YAML invalide : {error}"
  needs_buttons: un fichier de bibliothèque commence par "buttons:" suivi d'une liste de touches
  top_field: champ de premier niveau inconnu {fields} (seul "buttons" est autorisé)
  buttons_list: '"buttons" doit être une liste : chaque touche sur une ligne qui commence par "  - "'

# Checks of keys and knobs of plugin types.
plugins_check:
  field_needed: "{type} nécessite « {field} »"
  not_an_entity: "{field} n'est pas un identifiant d'entité : {value}"
  wrong_domain: "{value} n'est pas l'un de : {domains}"
  number_range: "{field} doit être entre {min} et {max}"
  not_an_option: "{field} doit être l'un de : {options} (pas {value})"
  "off": "{name} est désactivé"
  unknown_plugin: "plugin inconnu : {id}"
  not_running: "{name} n'est pas actif"
