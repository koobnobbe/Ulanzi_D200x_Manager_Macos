  hint: "Enregistré sous page_settings: dans le fichier du profil. Le déplacement à gauche ou à droite est immédiat ; les touches suivent."

new_profile_dialog:
  title: Nouveau profil
  name: Nom (devient profiles/<nom>.yaml)

docs_viewer:
  title: D200X Manager · Documentation
  not_found_title: Introuvable
  not_found: page {name} introuvable
  home_link: Aller à la page d'accueil
  no_sidebar: docs/_sidebar.md est manquant

# Messages du serveur affichés dans l'interface web.
