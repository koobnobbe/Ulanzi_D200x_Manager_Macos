  save: "Enregistrer"
  saved: "Enregistré."
  test: "Tester la connexion"
  testing: "Test en cours…"
  secret_set: "enregistré ; laissez vide pour le garder"
  none: "Aucun plugin trouvé dans plugins/."
  status:
    connected: "connecté"
    connecting: "connexion…"
    error: "erreur"
    "off": "désactivé"
    starting: "démarrage…"
    running: "actif"

screen_dialog:
  title: Config écran
  language: Langue
  hint: "Enregistré sous ui: dans config.yaml. La page se recharge ensuite."

background:
  image: Image
  color: Couleur unie
  remove: Supprimer l'arrière-plan
  none_black: aucun (noir)

page_dialog:
  title: "Page {page} · {profile}"
  name: Nom (sur l'onglet)
  background: Arrière-plan de cette page
  background_profile: comme le profil
  order: Ordre
  move_left: ← Vers la gauche
  move_right: Vers la droite →
