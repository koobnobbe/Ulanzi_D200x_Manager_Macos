app_dialog:
  title: Choisir une app
  finder_folder: /System/Library/CoreServices (Finder)
  filter: filtrer par nom

device_dialog:
  title: Réglages de l'appareil
  screensaver: Économiseur d'écran
  mode: Mode
  mode_off: Désactivé (le deck reste allumé)
  mode_firmware: Économiseur du firmware (après ~30 s, sans keep-alive)
  mode_dim: Atténuer
  mode_color: Couleur unie
  mode_image: Image sur toutes les touches
  timeout: Après (secondes d'inactivité)
