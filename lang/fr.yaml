# Textes du D200X Manager (interface web et messages qui y apparaissent).
#
# Les textes absents de ce fichier sont pris dans lang/en.yaml.
# Gardez les clés (à gauche des deux-points) et les {noms} entre accolades tels quels.
# Mettez entre guillemets un texte qui contient deux-points suivis d'un espace, # ou {.

app:
  title: D200X Manager
  heading: Ulanzi D200X
  language_name: Français   # nom de cette langue dans la liste
  lang: fr
  locale: fr-FR          # pour l'heure de l'horloge dans l'interface web

common:
  cancel: Annuler
  save: Enregistrer
  close: Fermer
  create: Créer
  choose: Choisir…
  new: Nouveau…
  none: aucun
  remove: Supprimer

header:
  profile: "Profil : {name}"
  brightness: Luminosité
  screen: Config écran…
  device: Appareil…
  libraries: Bibliothèques…
  plugins: Plugins…
  reload: Recharger la config

sidebar:
  profiles: Profils
  active: "{name}  (actif)"
  default_settings: Réglages (arrière-plan)
  linked_app: Activé par {app}
