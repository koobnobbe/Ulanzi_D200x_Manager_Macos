  zip_without_yaml: "{file} : choisissez aussi le fichier .yaml du même nom"

plugins_dialog:
  title: "Plugins"
  hint: "Les plugins sont du code local dans plugins/ qui ajoute des types de touches. Leurs réglages sont enregistrés par machine dans plugins.local.yaml, qui n'est pas dans git."
