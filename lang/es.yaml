# Textos del D200X Manager (interfaz web y los mensajes que aparecen en ella).
#
# Los textos que falten aquí se toman de lang/en.yaml.
# Deja tal cual las claves (a la izquierda de los dos puntos) y los {nombres} entre llaves.
# Pon entre comillas un texto que contenga dos puntos seguidos de un espacio, # o {.

app:
  title: D200X Manager
  heading: Ulanzi D200X
  language_name: Español   # nombre de este idioma en la lista
  lang: es
  locale: es-ES          # para la hora del reloj en la interfaz web

common:
  cancel: Cancelar
  save: Guardar
  close: Cerrar
  create: Crear
  choose: Elegir…
  new: Nuevo…
  none: ninguno
  remove: Eliminar

header:
  profile: "Perfil: {name}"
  brightness: Brillo
  screen: Config. de pantalla…
  device: Dispositivo…
  libraries: Bibliotecas…
  plugins: Plugins…
  reload: Recargar config

sidebar:
  profiles: Perfiles
  active: "{name}  (activo)"
  default_settings: Ajustes (fondo)
  linked_app: Activado por {app}
  no_app: "Sin app: haz clic para elegir una"
  new_profile: + Nuevo perfil
  docs: Documentación

grid:
  pages: Páginas
