  right: Derecha (sentido horario)
  press: Pulsar
  step: Paso (solo device_brightness)
  hint: "Con text: el texto que se imprime. Con key: combinación(es) de teclas. Con device_brightness solo se usa el paso."

image_dialog:
  title: Elige una imagen (se convierte en 192x192 en icons/)
