  save: "Guardar"
  saved: "Guardado."
  test: "Probar la conexión"
  testing: "Probando…"
  secret_set: "guardado; déjalo vacío para mantenerlo"
  none: "No hay plugins en plugins/."
  status:
    connected: "conectado"
    connecting: "conectando…"
    error: "error"
    "off": "desactivado"
    starting: "iniciando…"
    running: "activo"

screen_dialog:
  title: Config. de pantalla
  language: Idioma
  hint: "Se guarda en ui: de config.yaml. Después la página se recarga."

background:
  image: Imagen
  color: Color sólido
  remove: Quitar fondo
  none_black: ninguno (negro)

page_dialog:
  title: "Página {page} · {profile}"
  name: Nombre (en la pestaña)
  background: Fondo de esta página
  background_profile: igual que el perfil
  order: Orden
  move_left: ← A la izquierda
  move_right: A la derecha →
  remove: Eliminar página
  remove_confirm: ¿Eliminar la página {page} con todas sus teclas? Las teclas que van a esta página irán a la página 1.
  hint: "Se guarda en page_settings: del archivo del perfil. Mover a la izquierda o a la derecha es inmediato; las teclas se mueven con ella."

new_profile_dialog:
  title: Nuevo perfil
  name: Nombre (se convierte en profiles/<nombre>.yaml)

docs_viewer:
  title: D200X Manager · Documentación
  not_found_title: No encontrado
  not_found: página {name} no encontrada
  home_link: Ir a la página de inicio
  no_sidebar: falta docs/_sidebar.md

# Mensajes del servidor que aparecen en la interfaz web.
errors:
  at: "{where}: {error}"
  unknown_section: sección desconocida
  unknown_item: elemento desconocido
  unknown_profile: "perfil desconocido: {name}"
  invalid_name: "nombre no válido: usa letras, números, espacio, - o _"
  invalid_filename: "nombre de archivo no válido: usa letras, números, espacio, - o _"
  library_exists: la biblioteca {name} ya existe
  profile_exists: el perfil {name} ya existe
  choose_yaml: elige un archivo .yaml
  not_an_image: "no es una imagen: elige un png, jpg, ico o icns"
  icon_name_needed: ponle un nombre al icono
  image_name_needed: ponle un nombre a la imagen
  key_empty: esta tecla está vacía
  default_no_app: el perfil default no puede pertenecer a una app
  not_an_app: "no es una app: {app}"
  app_taken: "{app} ya activa el perfil {profile}"
  background_missing: "fondo no encontrado: {path}"
  hex_color: "{field} debe ser un color hexadecimal, p. ej. #1a1a2e"
  saver_mode: modo de salvapantallas desconocido
  keep_alive_range: el intervalo de keep-alive debe estar entre 0,2 y 10 segundos
  saver_timeout_range: el tiempo del salvapantallas debe estar entre 5 y 3600 segundos
  saver_brightness_range: el brillo del salvapantallas debe estar entre 0 y 100
  saver_image_needed: elige una imagen para el salvapantallas
  unknown_language: "idioma desconocido: {language}"
  file_missing: "{field}: archivo no encontrado"
  first_page: la página 1 no se puede eliminar
  page_edge: esta página ya está en el borde
  page_name_long: el nombre puede tener como máximo {max} caracteres
  unknown_page_number: la página {page} no existe
  bad_zip: no es un zip válido de iconos png

# Errores en config.yaml o en un perfil. La config anterior sigue activa.
config:
  key: "tecla {number}: {error}"
  knob: "mando {name}: {error}"
  unknown_combo: "combinación de teclas desconocida: {combo}"
  unknown_type: "tipo desconocido: {type}"
  app_not_found: "app no encontrada: {app}"
  keys_needed: el tipo key necesita "keys"
  background_image_missing: "background_image no encontrada: {path}"
  transparency_range: transparency debe estar entre 0 y 100
  key_out_of_range: "página {page}: la tecla {number} no existe"
  unknown_page: "página {page} tecla {number}: página desconocida: {target}"
  no_pages: este archivo no tiene sección pages
  page_missing: la página {page} no está en este archivo
  buttons_moved: '"buttons" se ha movido: pon las teclas bajo "pages: 1:"'

# Comprobación de un archivo de biblioteca al importarlo.
library_check:
  entry: tecla {number}
  entry_titled: tecla {number} ({title})
  hold: "{where} (hold)"
  not_a_key: "debe ser una tecla, p. ej. {type: key, title: Copy, keys: cmd+c}"
  unknown_field: campo desconocido {fields}
  page_needed: el tipo page necesita "page" (home, next, previous o un número)
  profile_needed: el tipo profile necesita "profile"
  not_a_color: "{field} no es un color: {value}"
  font_size_range: font_size debe ser un número de 8 a 200
  transparency_number: transparency debe ser un número de 0 a 100
  icon_missing: "icono no encontrado: {path}"
  hold_in_hold: hold no puede tener su propio hold
  invalid_yaml: "YAML no válido: {error}"
  needs_buttons: un archivo de biblioteca empieza con "buttons:" seguido de una lista de teclas
  top_field: campo de nivel superior desconocido {fields} (solo se permite "buttons")
  buttons_list: '"buttons" debe ser una lista: cada tecla en una línea que empiece por "  - "'

# Checks of keys and knobs of plugin types.
plugins_check:
  field_needed: "{type} necesita \"{field}\""
  not_an_entity: "{field} no es un id de entidad: {value}"
  wrong_domain: "{value} no es uno de: {domains}"
  number_range: "{field} debe estar entre {min} y {max}"
  not_an_option: "{field} debe ser uno de: {options} (no {value})"
  "off": "{name} está desactivado"
  unknown_plugin: "plugin desconocido: {id}"
  not_running: "{name} no está activo"
