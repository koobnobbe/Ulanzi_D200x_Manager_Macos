  new_page: + Nueva página
  page_config: config
  key_14: tecla 14
  clock_window: ventana del reloj (ajustes)
  knob: mando {number}
  knob_tooltip: "{knob}\nizquierda: {left}  |  pulsar: {press}  |  derecha: {right}"
  config_error: "La última config tiene un error, la config anterior sigue activa:\n{error}"
  log: Registro

log:
  error: "error: {message}"
  profile_created: Perfil {name} creado (profiles/{name}.yaml)
  library_created: Biblioteca {name} creada
  library_imported: Biblioteca {name} importada
  library_deleted: Eliminado de library/{section}.yaml
  library_added: Tecla añadida a library/template.yaml
  library_moved: Movido a {section}

library:
  title: Biblioteca
  bin: Arrastra aquí para eliminar
