  color: Color
  image: Imagen
  other: Otros
  keep_alive: Intervalo de keep-alive (s)
  hint: "Se guarda en device: de config.yaml. Una pulsación en una tecla o mando termina el salvapantallas; esa pulsación no hace nada más. El brillo está arriba en la página."

profile_dialog:
  header: Perfil {name}
  app: App que activa este perfil
  no_app: sin app
  hint_app: El perfil se activa en cuanto esta app pasa al primer plano en el Mac.
  background: Fondo (sobre toda la pantalla, visible a través de la transparencia de una tecla)
  unlink: Desvincular app
  unlink_confirm: ¿Desvincular la app del perfil {name}? El perfil se conserva.

libraries_dialog:
  title: Bibliotecas
  hint: Solo las bibliotecas marcadas aparecen en el panel de biblioteca.
  count: "{count} teclas"
  import: Importar…
  import_failed: "{file} no importado: {error}"
  import_hint: Elige el archivo .yaml, junto con el .zip del mismo nombre si la biblioteca tiene iconos propios.
  zip_without_yaml: "{file}: elige también el archivo .yaml con el mismo nombre"

plugins_dialog:
  title: "Plugins"
  hint: "Los plugins son código local en plugins/ que añade tipos de teclas. Sus ajustes se guardan por equipo en plugins.local.yaml, que no está en git."
