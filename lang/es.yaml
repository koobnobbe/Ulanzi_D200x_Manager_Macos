  keys: Teclas (key)
  keys_placeholder: cmd+c o cmd+a, cmd+c
  hint_key: Combinación(es) de teclas, separadas por comas para una secuencia.
  key_groups:
    media: Multimedia
    special: Especiales
    letters: Letras
    digits: Números
    other: Otros
  app: App (ruta .app)
  app_profile: Perfil para esta app
  app_profile_auto: automático (perfil vinculado)
  app_profile_none: sin perfil
  hint_app: Por defecto se carga el perfil vinculado a esta app. Elige "sin perfil" para no cargar ninguno.
  page: Página (page)
  page_home: home (página 1)
  page_next: next (página siguiente)
  page_previous: previous (página anterior)
  page_number: página {page}
  hint_page: Va a una página del perfil actual.
  profile: Perfil (profile)
  hint_profile: Carga este perfil. default es config.yaml.
  background: Fondo
  color: Color del texto
