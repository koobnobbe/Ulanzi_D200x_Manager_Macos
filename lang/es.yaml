  entity_placeholder: "Buscar por nombre…"

knob_dialog:
  header: "{knob} · {profile}"
  type: Tipo
  type_text: text (imprimir texto)
  type_key: key (enviar teclas)
  type_brightness: device_brightness (brillo del deck)
