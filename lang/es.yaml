  filter: filtrar por nombre

device_dialog:
  title: Ajustes del dispositivo
  screensaver: Salvapantallas
  mode: Modo
  mode_off: Apagado (el deck sigue activo)
  mode_firmware: Salvapantallas del firmware (tras ~30 s, sin keep-alive)
  mode_dim: Atenuar
  mode_color: Color sólido
