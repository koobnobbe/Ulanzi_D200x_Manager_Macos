# Teksten van de D200X Manager (webinterface en de meldingen die daarin verschijnen).
#
# Een andere taal: kopieer dit bestand naar bijvoorbeeld lang/en.yaml, vertaal de teksten (ook
# app.language_name) en kies de taal in de webinterface onder "Scherm config…".
# Ontbreekt een tekst in een taal, dan wordt de Engelse uit lang/en.yaml gebruikt.
# Laat de sleutels (links van de dubbele punt) en de {namen} tussen accolades staan.
# Zet een tekst met een dubbele punt, # of { tussen aanhalingstekens.

app:
  title: D200X Manager
  heading: Ulanzi D200X
  language_name: Nederlands   # naam van deze taal in de keuzelijst
  lang: nl
  locale: nl-NL          # voor de tijd op de klok in de webinterface

common:
  cancel: Annuleren
  save: Opslaan
  close: Sluiten
  create: Aanmaken
  choose: Kies…
  new: Nieuw…
  none: geen
  remove: Verwijderen

header:
