# Fouten in config.yaml of een profiel. De vorige config blijft dan actief.
config:
  key: "toets {number}: {error}"
  knob: "draaiknop {name}: {error}"
  unknown_combo: "onbekende toetscombinatie: {combo}"
  unknown_type: "onbekend type: {type}"
  app_not_found: "app niet gevonden: {app}"
  keys_needed: type key heeft "keys" nodig
  background_image_missing: "background_image niet gevonden: {path}"
  transparency_range: transparency moet tussen 0 en 100 liggen
  key_out_of_range: "pagina {page}: toets {number} bestaat niet"
  unknown_page: "pagina {page} toets {number}: onbekende pagina: {target}"
  no_pages: dit bestand heeft geen pages-sectie
  page_missing: pagina {page} staat niet in dit bestand
  buttons_moved: '"buttons" is verplaatst: zet de toetsen onder "pages: 1:"'

# Controle van een bibliotheekbestand bij importeren.
library_check:
  entry: toets {number}
  entry_titled: toets {number} ({title})
  hold: "{where} (hold)"
  not_a_key: "moet een toets zijn, bijv. {type: key, title: Copy, keys: cmd+c}"
  unknown_field: onbekend veld {fields}
  page_needed: type page heeft "page" nodig (home, next, previous of een nummer)
  profile_needed: type profile heeft "profile" nodig
  not_a_color: "{field} is geen kleur: {value}"
  font_size_range: font_size moet een getal van 8 tot 200 zijn
  transparency_number: transparency moet een getal van 0 tot 100 zijn
  icon_missing: "icoon niet gevonden: {path}"
  hold_in_hold: hold kan zelf geen hold hebben
  invalid_yaml: "geen geldige YAML: {error}"
  needs_buttons: een library-bestand heeft bovenaan "buttons:" met daaronder een lijst toetsen
  top_field: onbekend veld bovenaan {fields} (alleen "buttons" is toegestaan)
  buttons_list: '"buttons" moet een lijst zijn: elke toets op een regel die begint met "  - "'

# Checks of keys and knobs of plugin types.
plugins_check:
  field_needed: "{type} heeft \"{field}\" nodig"
  not_an_entity: "{field} is geen entity-id: {value}"
  wrong_domain: "{value} is niet een van: {domains}"
  number_range: "{field} moet tussen {min} en {max} liggen"
  not_an_option: "{field} moet een van deze zijn: {options} (niet {value})"
  "off": "{name} staat uit"
  unknown_plugin: "onbekende plugin: {id}"
  not_running: "{name} draait niet"
