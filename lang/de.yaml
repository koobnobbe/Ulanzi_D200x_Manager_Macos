  knob: Drehknopf {number}
  knob_tooltip: "{knob}\nlinks: {left}  |  drücken: {press}  |  rechts: {right}"
  config_error: "Die letzte Config enthält einen Fehler, die vorherige Config bleibt aktiv:\n{error}"
  log: Protokoll

log:
  error: "Fehler: {message}"
  profile_created: Profil {name} erstellt (profiles/{name}.yaml)
  library_created: Bibliothek {name} erstellt
  library_imported: Bibliothek {name} importiert
  library_deleted: Entfernt aus library/{section}.yaml
  library_added: Taste zu library/template.yaml hinzugefügt
  library_moved: Verschoben nach {section}

library:
