# Texte des D200X Manager (Weboberfläche und die Meldungen, die darin erscheinen).
#
# Texte, die hier fehlen, werden aus lang/en.yaml genommen.
# Die Schlüssel (links vom Doppelpunkt) und die {Namen} in geschweiften Klammern unverändert lassen.
# Einen Text mit Doppelpunkt plus Leerzeichen, # oder { in Anführungszeichen setzen.

app:
  title: D200X Manager
  heading: Ulanzi D200X
  language_name: Deutsch   # Name dieser Sprache in der Auswahlliste
  lang: de
  locale: de-DE          # für die Uhrzeit der Uhr in der Weboberfläche

common:
  cancel: Abbrechen
  save: Speichern
  close: Schließen
  create: Erstellen
  choose: Auswählen…
  new: Neu…
  none: keine
  remove: Entfernen

header:
  profile: "Profil: {name}"
  brightness: Helligkeit
  screen: Bildschirm-Config…
  device: Gerät…
  plugins: Plugins…
  reload: Config neu laden

sidebar:
