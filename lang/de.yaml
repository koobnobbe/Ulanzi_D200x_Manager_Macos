  mode_color: Einfarbig
  mode_image: Bild über alle Tasten
  timeout: Nach (Sekunden inaktiv)
  saver_brightness: Helligkeit im Bildschirmschoner
  color: Farbe
  image: Bild
  other: Sonstiges
  keep_alive: Keep-alive-Intervall (s)
