profile_dialog:
  header: Profil {name}
  app: App, die dieses Profil aktiviert
  no_app: keine App
  hint_app: Das Profil wird aktiv, sobald diese App auf dem Mac in den Vordergrund kommt.
  background: Hintergrund (über den ganzen Bildschirm, sichtbar durch die Transparenz einer Taste; ohne Bild schwarz)
  unlink: App trennen
  unlink_confirm: App von Profil {name} trennen? Das Profil selbst bleibt erhalten.

plugins_dialog:
  title: Plugins
  hint: Nur angehakte Bibliotheken erscheinen im Bibliotheksbereich.
  count: "{count} Tasten"
  import: Importieren…
  import_failed: "{file} nicht importiert: {error}"
  import_hint: Die .yaml-Datei wählen, zusammen mit der .zip gleichen Namens, wenn die Bibliothek eigene Symbole hat.
  zip_without_yaml: "{file}: auch die .yaml-Datei mit demselben Namen wählen"

screen_dialog:
  title: Bildschirm-Config
  language: Sprache
  hint: "Wird unter ui: in config.yaml gespeichert. Die Seite wird danach neu geladen."

new_profile_dialog:
  title: Neues Profil
