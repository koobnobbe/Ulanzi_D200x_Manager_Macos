# Library section "Apple MacOS": macOS shortcuts. Drag an entry onto a key in the web interface.
# System shortcuts (screenshots, Spotlight, Mission Control, ...) follow the settings in
# System Settings > Keyboard > Keyboard Shortcuts; if you changed one there, change it here too.
buttons:
  # Edit
  - {type: key, title: Cut, keys: cmd+x, font_size: 44}
  - {type: key, title: Copy, keys: cmd+c, font_size: 44}
  - {type: key, title: Paste, keys: cmd+v, font_size: 44}
  - {type: key, title: Paste plain, keys: cmd+alt+shift+v, font_size: 36}
  - {type: key, title: Undo, keys: cmd+z, font_size: 44}
  - {type: key, title: Redo, keys: cmd+shift+z, font_size: 44}
  - {type: key, title: Select all, keys: cmd+a, font_size: 44}
  - {type: key, title: Find, keys: cmd+f, font_size: 44}
  - {type: key, title: Save, keys: cmd+s, font_size: 44}
  - {type: key, title: Print, keys: cmd+p, font_size: 44}
  # Screenshots (Print Screen)
  - {type: key, title: Screen, keys: cmd+shift+3, font_size: 44}
  - {type: key, title: Area, keys: cmd+shift+4, font_size: 44}
  - {type: key, title: Screenshot, keys: cmd+shift+5, font_size: 32}
  - {type: key, title: Screen clip, keys: ctrl+cmd+shift+3, font_size: 32}
  - {type: key, title: Area clip, keys: ctrl+cmd+shift+4, font_size: 44}
  # Apps and windows
  - {type: key, title: App switch, keys: cmd+tab, font_size: 32}
  - {type: key, title: Window, keys: cmd+`, font_size: 44}
  - {type: key, title: New, keys: cmd+n, font_size: 44}
  - {type: key, title: New tab, keys: cmd+t, font_size: 44}
  - {type: key, title: Reopen tab, keys: cmd+shift+t, font_size: 32}
  - {type: key, title: Close, keys: cmd+w, font_size: 44}
  - {type: key, title: Quit, keys: cmd+q, font_size: 44}
  - {type: key, title: Hide, keys: cmd+h, font_size: 44}
  - {type: key, title: Hide others, keys: cmd+alt+h, font_size: 32}
  - {type: key, title: Minimize, keys: cmd+m, font_size: 44}
  - {type: key, title: Full screen, keys: ctrl+cmd+f, font_size: 36}
  - {type: key, title: Settings, keys: 'cmd+,', font_size: 44}
  - {type: key, title: Force quit, keys: cmd+alt+esc, font_size: 36}
  # System
  - {type: key, title: Spotlight, keys: cmd+space, font_size: 44}
  - {type: key, title: Emoji, keys: ctrl+cmd+space, font_size: 44}
  - {type: key, title: Mission, keys: ctrl+up, font_size: 44}
  - {type: key, title: App windows, keys: ctrl+down, font_size: 28}
  - {type: key, title: Desktop, keys: f11, font_size: 44}
  - {type: key, title: Space <, keys: ctrl+left, font_size: 44}
  - {type: key, title: Space >, keys: ctrl+right, font_size: 44}
  - {type: key, title: Lock, keys: ctrl+cmd+q, font_size: 44}
  - {type: key, title: Log out, keys: cmd+shift+q, font_size: 44}
  # Finder
  - {type: key, title: New folder, keys: cmd+shift+n, font_size: 36}
  - {type: key, title: Go to folder, keys: cmd+shift+g, font_size: 32}
  - {type: key, title: Get info, keys: cmd+i, font_size: 44}
  - {type: key, title: Quick Look, keys: space, font_size: 32}
  - {type: key, title: Trash, keys: cmd+backspace, font_size: 44}
  - {type: key, title: Empty trash, keys: cmd+shift+backspace, font_size: 32}
  - {type: key, title: Hidden files, keys: cmd+shift+., font_size: 32}
  - {type: key, title: Move here, keys: cmd+alt+v, font_size: 36}
  # Text
  - {type: key, title: Line start, keys: cmd+left, font_size: 40}
  - {type: key, title: Line end, keys: cmd+right, font_size: 44}
  - {type: key, title: Top, keys: cmd+up, font_size: 44}
  - {type: key, title: Bottom, keys: cmd+down, font_size: 44}
  - {type: key, title: Del word, keys: alt+backspace, font_size: 44}
