# Library section "BusyCal": keys for BusyCal. Drag an entry onto a key in the web interface.
# The shortcuts come from BusyCal's own menus (View, File, Edit). A list of combos is sent in order,
# e.g. [cmd+1, cmd+t, cmd+right] = day view, go to today, next day.
# The key icons (BusyCal-blue tile with the title below) are in BusyCal.zip; dragging a key onto the deck copies its icon to icons/.
buttons:
  - {type: app, app: /Applications/BusyCal.app, title: BusyCal, font_size: 30}
  # Jump to a day, week or month
  - {type: key, title: Vandaag, keys: [cmd+1, cmd+t], icon: icons/busycal-today.png}
  - {type: key, title: Morgen, keys: [cmd+1, cmd+t, cmd+right], icon: icons/busycal-tomorrow.png}
  - {type: key, title: Gisteren, keys: [cmd+1, cmd+t, cmd+left], icon: icons/busycal-yesterday.png}
  - {type: key, title: Deze week, keys: [cmd+2, cmd+t], icon: icons/busycal-this-week.png}
  - {type: key, title: Volg. week, keys: [cmd+2, cmd+t, cmd+right], icon: icons/busycal-next-week.png}
  - {type: key, title: Vor. week, keys: [cmd+2, cmd+t, cmd+left], icon: icons/busycal-previous-week.png}
  - {type: key, title: Deze mnd, keys: [cmd+3, cmd+t], icon: icons/busycal-this-month.png}
  - {type: key, title: Volg. mnd, keys: [cmd+3, cmd+t, cmd+right], icon: icons/busycal-next-month.png}
  - {type: key, title: Nu, keys: cmd+t, icon: icons/busycal-now.png}
  - {type: key, title: Vorige, keys: cmd+left, icon: icons/busycal-previous.png}
  - {type: key, title: Volgende, keys: cmd+right, icon: icons/busycal-next.png}
  - {type: key, title: Ga naar…, keys: cmd+shift+t, icon: icons/busycal-go-to.png}
  # Views
  - {type: key, title: Dag, keys: cmd+1, icon: icons/busycal-day.png}
  - {type: key, title: Week, keys: cmd+2, icon: icons/busycal-week.png}
  - {type: key, title: Maand, keys: cmd+3, icon: icons/busycal-month.png}
  - {type: key, title: Jaar, keys: cmd+4, icon: icons/busycal-year.png}
  - {type: key, title: Lijst, keys: cmd+5, icon: icons/busycal-list.png}
  # New items and tools
  - {type: key, title: + Afspraak, keys: cmd+n, icon: icons/busycal-new-event.png}
  - {type: key, title: + Snel, keys: alt+cmd+n, icon: icons/busycal-quick-event.png}
  - {type: key, title: + Taak, keys: cmd+k, icon: icons/busycal-new-task.png}
  - {type: key, title: Zoeken, keys: cmd+f, icon: icons/busycal-search.png}
  - {type: key, title: To-do's, keys: alt+cmd+t, icon: icons/busycal-todos.png}
  - {type: key, title: Ververs, keys: cmd+r, icon: icons/busycal-refresh.png}
