# Library section "Agenda": keys for BusyCal. Drag an entry onto a key in the web interface.
# The shortcuts come from BusyCal's own menus (View, File, Edit). A list of combos is sent in order,
# e.g. [cmd+1, cmd+t, cmd+right] = day view, go to today, next day.
buttons:
  - {type: app, app: /Applications/BusyCal.app, title: BusyCal, font_size: 30}
  # Jump to a day, week or month
  - {type: key, title: Vandaag, keys: [cmd+1, cmd+t], font_size: 36}
  - {type: key, title: Morgen, keys: [cmd+1, cmd+t, cmd+right], font_size: 36}
  - {type: key, title: Gisteren, keys: [cmd+1, cmd+t, cmd+left], font_size: 36}
  - {type: key, title: Deze week, keys: [cmd+2, cmd+t], font_size: 32}
  - {type: key, title: Volg. week, keys: [cmd+2, cmd+t, cmd+right], font_size: 30}
  - {type: key, title: Vor. week, keys: [cmd+2, cmd+t, cmd+left], font_size: 30}
  - {type: key, title: Deze mnd, keys: [cmd+3, cmd+t], font_size: 32}
  - {type: key, title: Volg. mnd, keys: [cmd+3, cmd+t, cmd+right], font_size: 30}
  - {type: key, title: Nu, keys: "cmd+t", font_size: 50}
  - {type: key, title: "<", keys: "cmd+left"}
  - {type: key, title: ">", keys: "cmd+right"}
  - {type: key, title: Ga naar…, keys: "cmd+shift+t", font_size: 32}
  # Views
  - {type: key, title: Dag, keys: "cmd+1", font_size: 44}
  - {type: key, title: Week, keys: "cmd+2", font_size: 44}
  - {type: key, title: Maand, keys: "cmd+3", font_size: 40}
  - {type: key, title: Jaar, keys: "cmd+4", font_size: 44}
  - {type: key, title: Lijst, keys: "cmd+5", font_size: 44}
  # New items and tools
  - {type: key, title: + Afspraak, keys: "cmd+n", font_size: 30}
  - {type: key, title: + Snel, keys: "alt+cmd+n", font_size: 36}
  - {type: key, title: + Taak, keys: "cmd+k", font_size: 36}
  - {type: key, title: Zoeken, keys: "cmd+f", font_size: 36}
  - {type: key, title: To-do's, keys: "alt+cmd+t", font_size: 36}
  - {type: key, title: Ververs, keys: "cmd+r", font_size: 36}
