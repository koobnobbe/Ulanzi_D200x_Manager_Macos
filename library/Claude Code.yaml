# Library section "Claude Code": shortcuts of Claude Code, read from the installed CLI (2.1.299) and
# VS Code extension (2.1.296). Keys you changed in ~/.claude/keybindings.json are not taken into account.
# "alt+" keys are the CLI's "meta" keys: the terminal must send Option as Meta (Terminal: Profiles > Keyboard >
# "Use Option as Meta key"; VS Code: terminal.integrated.macOptionIsMeta).
# Terminal keys work where Claude Code runs in a terminal; the app hosting it may catch some combos first.
# Slash command keys type "/name" and Enter, assuming a US/ABC keyboard layout.
# The key icons (Claude-colored tile with the title below) are in "Claude Code.zip"; dragging a key onto the deck copies its icon to icons/.
buttons:
  # VS Code extension (from its package.json, version 2.1.296)
  - {type: key, title: Focus Claude, keys: cmd+esc, icon: icons/claude-code-focus-claude.png}
  - {type: key, title: New tab, keys: cmd+shift+esc, icon: icons/claude-code-new-tab.png}
  - {type: key, title: '@-Mention', keys: alt+k, icon: icons/claude-code-mention.png}
  - {type: key, title: Focus view, keys: ctrl+alt+f, icon: icons/claude-code-focus-view.png}
  # Prompt in the terminal (Chat bindings of the CLI, version 2.1.299)
  - {type: key, title: Stop, keys: esc, icon: icons/claude-code-stop.png}
  - {type: key, title: Mode, keys: shift+tab, icon: icons/claude-code-mode.png}
  - {type: key, title: Model, keys: alt+p, icon: icons/claude-code-model.png}
  - {type: key, title: Thinking, keys: alt+t, icon: icons/claude-code-thinking.png}
  - {type: key, title: Fast mode, keys: alt+o, icon: icons/claude-code-fast-mode.png}
  - {type: key, title: Clear input, keys: ctrl+l, icon: icons/claude-code-clear-input.png}
  - {type: key, title: Newline, keys: ctrl+j, icon: icons/claude-code-newline.png}
  - {type: key, title: Send now, keys: ctrl+enter, icon: icons/claude-code-send-now.png}
  - {type: key, title: Queue, keys: [ctrl+x, enter], icon: icons/claude-code-queue.png}
  - {type: key, title: Undo, keys: ctrl+-, icon: icons/claude-code-undo.png}
  - {type: key, title: Editor, keys: ctrl+g, icon: icons/claude-code-editor.png}
  - {type: key, title: Paste image, keys: ctrl+v, icon: icons/claude-code-paste-image.png}
  - {type: key, title: Stash, keys: ctrl+s, icon: icons/claude-code-stash.png}
  - {type: key, title: Background, keys: ctrl+b, icon: icons/claude-code-background.png}
  - {type: key, title: Kill agents, keys: [ctrl+x, ctrl+k], icon: icons/claude-code-kill-agents.png}
  # Anywhere in the terminal UI (Global bindings of the CLI)
  - {type: key, title: Interrupt, keys: ctrl+c, icon: icons/claude-code-interrupt.png}
  - {type: key, title: Exit, keys: ctrl+d, icon: icons/claude-code-exit.png}
  - {type: key, title: Todos, keys: ctrl+t, icon: icons/claude-code-todos.png}
  - {type: key, title: Transcript, keys: ctrl+o, icon: icons/claude-code-transcript.png}
  - {type: key, title: Brief, keys: ctrl+shift+b, icon: icons/claude-code-brief.png}
  - {type: key, title: History, keys: ctrl+r, icon: icons/claude-code-history.png}
  - {type: key, title: Artifact, keys: 'ctrl+]', icon: icons/claude-code-artifact.png}
  # Slash commands: typed into the prompt and sent with Enter (terminal and VS Code panel)
  - {type: key, title: /clear, keys: [/, c, l, e, a, r, enter], icon: icons/claude-code-clear.png}
  - {type: key, title: /compact, keys: [/, c, o, m, p, a, c, t, enter], icon: icons/claude-code-compact.png}
  - {type: key, title: /resume, keys: [/, r, e, s, u, m, e, enter], icon: icons/claude-code-resume.png}
  - {type: key, title: /rewind, keys: [/, r, e, w, i, n, d, enter], icon: icons/claude-code-rewind.png}
  - {type: key, title: /context, keys: [/, c, o, n, t, e, x, t, enter], icon: icons/claude-code-context.png}
  - {type: key, title: /usage, keys: [/, u, s, a, g, e, enter], icon: icons/claude-code-usage.png}
  - {type: key, title: /plan, keys: [/, p, l, a, n, enter], icon: icons/claude-code-plan.png}
  - {type: key, title: /model, keys: [/, m, o, d, e, l, enter], icon: icons/claude-code-slash-model.png}
  - {type: key, title: /status, keys: [/, s, t, a, t, u, s, enter], icon: icons/claude-code-status.png}
  - {type: key, title: /memory, keys: [/, m, e, m, o, r, y, enter], icon: icons/claude-code-memory.png}
  - {type: key, title: /mcp, keys: [/, m, c, p, enter], icon: icons/claude-code-mcp.png}
  - {type: key, title: /permissions, keys: [/, p, e, r, m, i, s, s, i, o, n, s, enter], icon: icons/claude-code-permissions.png}
  - {type: key, title: /export, keys: [/, e, x, p, o, r, t, enter], icon: icons/claude-code-export.png}
  - {type: key, title: /config, keys: [/, c, o, n, f, i, g, enter], icon: icons/claude-code-config.png}
  - {type: key, title: /help, keys: [/, h, e, l, p, enter], icon: icons/claude-code-help.png}
