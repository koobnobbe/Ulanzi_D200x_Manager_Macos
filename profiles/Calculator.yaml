# Profile for Calculator: used while Calculator is the frontmost app.
# Only "pages" and "knobs" are read from here; device and button_defaults come from config.yaml.
pages:
  1:
    2:  {type: key, keys: "8", title: "8"}
    1: {type: key, title: '7', keys: '7'}
    3:  {type: key, keys: "9", title: "9"}
    4:  {type: key, keys: "shift+=", title: "+"}
    5:  {type: key, keys: "esc", title: "C"}
    6:  {type: key, keys: "4", title: "4"}
    7:  {type: key, keys: "5", title: "5"}
    8:  {type: key, keys: "6", title: "6"}
    9:  {type: key, keys: "-", title: "-"}
    10: {type: key, keys: "shift+8", title: "*"}
    11: {type: key, keys: "1", title: "1"}
    12: {type: key, keys: "2", title: "2"}
    13: {type: key, keys: "3", title: "3"}
    14: {type: key, keys: "Enter", title: "Enter"}
    16: {type: key, keys: "0", title: "0", hold: {type: profile, profile: default}}
    17: {type: key, keys: "enter", title: "="}
  2:
    11: {type: page, page: previous, title: "<-"}
    2: {type: key, title: Paste, keys: cmd+v}
    1: {type: key, title: copy, keys: cmd+c}
    12: {type: page, page: home, title: "Home"}
    13: {type: page, page: next, title: "->"}
    14: {type: profile, profile: default}
    16: {type: page, page: home}
    17: {type: page, page: next}
